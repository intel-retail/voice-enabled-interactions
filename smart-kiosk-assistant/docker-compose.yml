# docker-compose.yml
#
# Starts audio-analyzer, text-to-speech, rag-service, kiosk-core, and kiosk-ui.
# Mic audio is captured by the browser via Web Audio API and uploaded as a
# file -- no host mic passthrough into the container is required.
#
# audio-analyzer and text-to-speech live in the separate edge-ai-libraries
# repository and have no local build context here — they are always pulled
# pre-built from Docker Hub using the image tags declared below.
#
# Pull (default):   docker compose pull && docker compose up -d
# Build from src:   docker compose build && docker compose up -d
# Stop:             docker compose down
# Logs:             docker compose logs -f

services:

  # ---------------------------------------------------------------------------
  # rtsp-streamer: publishes either bundled sample clips or a live webcam as
  # an RTSP stream via MediaMTX + ffmpeg (see ./rtsp-streamer/start.sh).
  #
  # Stream path is set by STREAM_NAME (see rtsp-streamer environment below).
  # Default: rtsp://rtsp-streamer:8554/queue
  #
  # Feeds the queue-service person-counting pipeline (queue-service/).
  # ---------------------------------------------------------------------------
  rtsp-streamer:
    build:
      context: ./rtsp-streamer
      dockerfile: Dockerfile
    image: ${REGISTRY:-intel}/rtsp-streamer:${RELEASE_TAG:-latest}
    container_name: rtsp-streamer
    # Gated behind the `queue` compose profile (container-layer flag), same
    # pattern as identity-service — ON by default via the Makefile's `up`
    # target (see QUEUE/_QUEUE_PROFILE there), so plain `make up` keeps
    # today's behaviour unchanged. Disable for a run with
    # `make up QUEUE=false` to free the ~10-12 CPU cores this + queue-service
    # otherwise permanently consume (measured: ~650-750% + ~350-500% CPU),
    # e.g. to isolate/benchmark the voice pipeline's own latency.
    profiles: ["queue"]
    user: "1000:1000"
    ports:
      - "8554:8554"
    environment:
      RTSP_SOURCE_MODE: ${RTSP_SOURCE_MODE:-sample}  # "sample" or "live" (see .env)
      MEDIA_DIR:      /media
      # Sample mode uses the existing MEDIA_FILES / MEDIA_FILE branches.
      # The bundled clips are mounted from ./Sample_data into /media.
      MEDIA_FILES:    ${MEDIA_FILES:-sample_1.mp4,sample_2.mp4}
      # Live mode reads from this V4L2 node. Sample mode ignores this value.
      CAMERA_DEVICE:  ${CAMERA_DEVICE:-}
      STREAM_NAME:    ${STREAM_NAME:-queue}
      RTSP_PORT:      "8554"
      LOOP_COUNT:     "-1"      # -1 = infinite loop for a continuous feed
      BLANK_DURATION: "0"       # seconds of black frames between loops
      NO_PROXY: "localhost,127.0.0.1,rtsp-streamer,queue-management,kiosk-core"
      no_proxy: "localhost,127.0.0.1,rtsp-streamer,queue-management,kiosk-core"
    # Compose cannot conditionally include devices. RTSP_CAMERA_DEVICE is
    # therefore resolved outside compose:
    #   sample mode -> /dev/null (safe on systems without a camera)
    #   live mode   -> CAMERA_DEVICE (validated by check-env/start.sh)
    devices:
      - ${RTSP_CAMERA_DEVICE:-/dev/null}:${RTSP_CAMERA_DEVICE:-/dev/null}
    group_add:
      - video
    volumes:
      - ./rtsp-streamer/start.sh:/opt/rtsp-streamer/start.sh:ro
      - ./Sample_data:/media:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8554"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # queue-service: YOLOv8 + OpenVINO person-counting pipeline.
  #
  # Reads the RTSP stream from rtsp-streamer, runs person detection + tracking,
  # counts people in a configurable ROI, and exposes:
  #   GET /api/v1/queue/count  — JSON { count, status, timestamp }
  #   GET /stream              — MJPEG video with bounding-box overlay
  #
  # The kiosk-ui nginx proxy routes /queue-svc/* → http://queue-service:8090/
  # ---------------------------------------------------------------------------
  queue-service:
    build:
      context: ./queue-service
      dockerfile: docker/Dockerfile
    image: ${REGISTRY:-intel}/queue-service:${RELEASE_TAG:-latest}
    container_name: queue-service
    # Gated behind the `queue` compose profile — see rtsp-streamer above for
    # the full rationale (ON by default; `make up QUEUE=false` disables it).
    profiles: ["queue"]
    user: "1000:1000"
    ports:
      - "8090:8090"
    environment:
      # Derive RTSP URL from the same STREAM_NAME that rtsp-streamer publishes,
      # so changing the media file in one place keeps the pipeline in sync.
      QUEUE_SERVICE__SOURCE__RTSP_URL: "rtsp://rtsp-streamer:8554/${STREAM_NAME:-queue}"
      # Inference device for the YOLO26 person detector. Defaults to CPU
      # (see queue-config.yaml `model.device` for rationale). Override via
      # QUEUE_DEVICE=GPU|NPU in .env once the target platform supports it —
      # no rebuild required.
      QUEUE_SERVICE__MODEL__DEVICE: ${QUEUE_DEVICE:-CPU}
      # Keep decoded frames in GPU (VA) memory through inference/tracking/
      # watermark instead of downloading every frame to system RAM (see
      # queue-config.yaml `model.va_memory` for the measured CPU cost).
      # "auto" enables it whenever a /dev/dri render node exists and the
      # device above isn't CPU — this INCLUDES NPU, which gains nothing
      # from it (NPU has no VA integration; see that file's comment) but
      # isn't actively harmed either. If reverting QUEUE_DEVICE back to
      # NPU, also set QUEUE_VA_MEMORY=false to restore the original,
      # measured-safe NPU behaviour.
      QUEUE_SERVICE__MODEL__VA_MEMORY: ${QUEUE_VA_MEMORY:-auto}
      # Run YOLO26 inference every Nth frame instead of every frame, to shed
      # GPU cycles when the device above is GPU (shared with ovms-llm).
      # Queue counting doesn't need per-frame granularity -- BYTE tracking
      # (tracker: below) sustains identities across skipped frames. Default
      # 1 (every frame) matches historical CPU/NPU behaviour; raise via
      # QUEUE_INFERENCE_INTERVAL in .env if GPU contention regresses
      # ovms-llm/audio-analyzer latency (see queue-config.yaml `model.
      # inference_interval`).
      QUEUE_SERVICE__MODEL__INFERENCE_INTERVAL: ${QUEUE_INFERENCE_INTERVAL:-1}
      NO_PROXY: "localhost,127.0.0.1,rtsp-streamer,queue-service"
      no_proxy: "localhost,127.0.0.1,rtsp-streamer,queue-service"
      ZE_ENABLE_ALT_DRIVERS: libze_intel_npu.so
    volumes:
      - ./queue-service/conf:/app/queue-service/conf:ro
      # models/ is NOT mounted — the IR is baked into the image at build time.
      # Run ./setup_models.sh first to download yolo26n IR to queue-service/models/,
      # then docker compose build to bake it in. See setup_models.sh for details.
      - ./queue-service/src:/app/queue-service/src:ro
    devices:
      - /dev/dri:/dev/dri
      - ${ACCEL_MOUNT_PATH:-/dev/null}:/dev/accel/accel0
    group_add:
      - video
      - "${RENDER_GID:-992}"
    depends_on:
      rtsp-streamer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # metrics-collector: OS-level hardware utilization collector.
  # Built on intel/retail-benchmark which provides supervisord, qmassa (Intel
  # GPU), Intel NPU tool, Intel PCM (power), sar (CPU), and free (memory).
  #
  # Endpoints (reachable by other containers as http://metrics-collector:9000):
  #   GET /health         -> liveness probe
  #   GET /metrics        -> cpu/gpu/npu/memory/power time-series JSON
  #   GET /platform-info  -> processor, iGPU, NPU, memory, storage summary
  #   GET /memory         -> latest memory snapshot
  # ---------------------------------------------------------------------------
  metrics-collector:
    # Pulled, not built. The source of truth for this image now lives in the
    # edge-ai-suites repo (health-and-life-sciences-ai-suite/
    # multi_modal_patient_monitoring/services/metrics-collector), shared with
    # the multi-modal patient monitoring suite.
    #
    # This service was previously built locally from ./kiosk_core/metrics-
    # collector because the then-published hl-ai-metrics-collector:2026.1.0
    # image predated the current source tree: it had no /health endpoint at
    # all (the healthcheck below could never pass — observed FailingStreak:
    # 1274), ran the older single-threaded http.server implementation
    # (serialised every request behind an unbounded qmassa JSON parse, making
    # the dashboard's /metrics poll take 20-40 s), and let qmassa's JSON grow
    # without bound (~596 MB/hour).
    #
    # Those fixes (FastAPI + uvicorn, /health, bounded qmassa collection via
    # collect_gpu.sh) have since been merged back into the edge-ai-suites
    # source, published as hl-ai-metrics-collector:2026.2.0, so this
    # service can go back to pulling the shared image instead of shadowing it
    # with a locally-built one. Override the tag with METRICS_COLLECTOR_TAG in
    # .env if a newer version is published.
    # Deliberately NOT ${REGISTRY}: that variable selects where the images we
    # build locally are tagged/pushed (e.g. REGISTRY=false while iterating), but
    # this image is only ever pulled from upstream, so following REGISTRY just
    # produces "pull access denied for false/hl-ai-metrics-collector" and blocks
    # `docker compose up` for the whole stack. Override the namespace with
    # METRICS_COLLECTOR_REGISTRY if it is ever mirrored elsewhere.
    image: ${METRICS_COLLECTOR_REGISTRY:-intel}/hl-ai-metrics-collector:${METRICS_COLLECTOR_TAG:-2026.2.0}
    container_name: metrics-collector
    privileged: true
    pid: host
    ports:
      - "9000:9000"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
    environment:
      METRICS_DIR:       /tmp/results
      METRICS_HTTP_PORT: "9000"
      NPU_LOG:           /tmp/results/npu_usage.csv
    volumes:
      - ${KIOSK_METRICS_HOST_DIR:-./metrics}:/tmp/results
      - /sys/devices:/sys/devices
      - /dev/dri:/dev/dri:rw
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /proc:/proc
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    # qmassa (run by /scripts/collect_gpu.sh under supervisord) writes one
    # continuously-appended JSON document and only closes it validly on a
    # graceful exit. supervisord's default per-program shutdown wait is 10s,
    # racing Docker's own default 10s container stop timeout -- when several
    # services are torn down together (`make down`/`docker compose down`),
    # this can lose the race and Docker SIGKILLs the container before qmassa
    # finishes flushing/closing the JSON, leaving a truncated file that
    # parse_qmassa_metrics_to_json.py rejects with "No valid state data
    # found". Giving this one container extra shutdown slack fixes it
    # without touching the (pulled, not built) image or its supervisord.conf.
    stop_grace_period: 30s

  audio-analyzer:
    # Built locally from the sibling edge-ai-libraries checkout, matching the
    # text-to-speech service above, so local changes to the ASR/diarization
    # pipeline are picked up. Comment out `build:` and rely on `image:` alone
    # to go back to pulling the upstream prebuilt image.
    #
    # Uses the top-level Dockerfile rather than docker/Dockerfile: the two are
    # identical except that this one parenthesises the torchcodec uninstall,
    # so `|| true` applies only to that uninstall instead of swallowing a
    # failure anywhere in the preceding pip chain (which would silently
    # produce a broken image).
    build:
      context: ../edge-ai-libraries/microservices/audio-analyzer
      dockerfile: Dockerfile
      # No HF_TOKEN build arg on purpose. The Dockerfile does
      # `ENV HF_TOKEN=${HF_TOKEN}`, so passing it at build time bakes the
      # secret permanently into an image layer (recoverable by anyone who can
      # inspect or pull the image). It is unnecessary anyway: the token is
      # already supplied at runtime in the environment block below, and the
      # service loads pyannote from the pre-cached ./models with
      # HF_HUB_OFFLINE=1, so nothing gated is fetched during the build.
    image: ${REGISTRY:-intel}/audio-analyzer:${RELEASE_TAG:-latest}
    container_name: audio-analyzer
    # Hardcoded to match the image's baked-in app user and the
    # ownership of the named volumes. Do not change.
    user: "1000:1000"
    ports:
      - "8010:8010"
    devices:
      - /dev/dri:/dev/dri
      # Intel NPU passthrough is driven by ACCEL_MOUNT_PATH so direct Compose
      # runs stay CPU/GPU-safe on hosts without an NPU.
      - ${ACCEL_MOUNT_PATH:-/dev/null}:/dev/accel/accel0
    group_add:
      - video
      - "${RENDER_GID:-992}"
    environment:
      # Required for Level Zero to enumerate the Intel NPU. Harmless when no
      # NPU node is mapped — OpenVINO then reports CPU/GPU only.
      ZE_ENABLE_ALT_DRIVERS: libze_intel_npu.so
      # Whisper mis-detects language on short kiosk chunks and replies in
      # Spanish; forcing en cut WER 11.0% -> 7.0% on every device. The
      # language is a per-request parameter, so it is set by kiosk-core
      # (KIOSK_CORE_ASR_LANGUAGE, see the kiosk-core service below), not by
      # audio-analyzer config. NOTE: it must be left EMPTY whenever the ASR
      # checkpoint is English-only, which the shipped default
      # (distil-whisper/distil-small.en) is -- such models reject the <|en|>
      # token outright. See KIOSK_CORE_ASR_LANGUAGE for the full note.
      # Point HF cache under the same parent as ~/.cache/whisper so a single
      # ./.cache mount persists every model cache the service uses
      # (huggingface, openai-whisper, torch hub, etc.).
      HF_HOME: /app/audio_analyzer/.cache/huggingface
      # Force fully offline operation for HF model/tokenizer loading. The
      # pyannote diarization pipeline's local files (segmentation, embedding,
      # plda incl. xvec_transform.npz) are already fully cached under
      # ./models by ensure_model.py — but without these flags,
      # huggingface_hub still makes a live metadata/revision check on every
      # load even when local files are present, which crashes/silently
      # disables diarization when there is no network/proxy access at all.
      # Confirmed fix: with HF_HUB_OFFLINE=1 forced, PyannoteDiarizer loads
      # successfully from local cache with zero network calls.
      # Set HF_HUB_OFFLINE=0 / TRANSFORMERS_OFFLINE=0 in .env if this
      # environment has working internet/proxy access and you want live
      # Hub checks (e.g. picking up a newly-released model revision).
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      # HuggingFace token — required by Pyannote speaker diarization.
      # Set HF_TOKEN in .env (single source of truth).
      HF_TOKEN: ${HF_TOKEN:-}
      # Map HF_TOKEN into the config loader's namespace so config.models.asr.hf_token
      # resolves to the token instead of null. The config_loader uses AUDIO_ANALYZER__
      # prefix with __ as path separator (models__asr__hf_token → models.asr.hf_token).
      AUDIO_ANALYZER__MODELS__ASR__HF_TOKEN: ${HF_TOKEN:-}
      # Gate pyannote speaker-diarization + segmentation model preload with the
      # same flag kiosk-core uses to decide whether to request diarization.
      # ./configs/audio-analyzer/config.yaml pins models.asr.diarization: True,
      # which makes preload_models() load pyannote at startup unconditionally —
      # this override lets KIOSK_CORE_DIARIZATION_ENABLED=false (e.g. in CI,
      # where no HF_TOKEN/model-licence acceptance is available) also skip that
      # preload, instead of crashing with an unauthenticated 403 download.
      AUDIO_ANALYZER__MODELS__ASR__DIARIZATION: ${KIOSK_CORE_DIARIZATION_ENABLED:-true}
      # ASR inference device override — config.yaml now pins "GPU" by default
      # (see its models.asr.device comment: 2026-09-22 switch to
      # distil-small.en/GPU for the final-commit pool too). Set ASR_DEVICE=CPU
      # here to compare against GPU without editing the mounted config file.
      # Do NOT set ASR_DEVICE=NPU while models.asr.name is distil-small.en —
      # that combination is confirmed to corrupt output on this stack.
      AUDIO_ANALYZER__MODELS__ASR__DEVICE: ${ASR_DEVICE:-CPU}
      # ASR model override — paired with ASR_DEVICE because the two are not
      # independent: distil-small.en corrupts output on NPU (see above), so a
      # device-combination benchmark profile that selects ASR_DEVICE=NPU must
      # also move the model to an NPU-safe one. Defaults to empty so the
      # mounted config.yaml's own models.asr.name wins when unset (compose
      # omits an env var entirely when its value resolves to the empty string
      # only for `KEY:` form, so the default here is the config's own value).
      AUDIO_ANALYZER__MODELS__ASR__NAME: ${ASR_MODEL:-distil-whisper/distil-small.en}
      # Preview (partial/streaming) ASR pool device. Distinct from the
      # final-commit pool above — config.yaml carries models.asr.preview.device
      # separately. Falls back to ASR_DEVICE so a profile only has to set one
      # variable unless it deliberately splits the two pools.
      AUDIO_ANALYZER__MODELS__ASR__PREVIEW__DEVICE: ${ASR_PREVIEW_DEVICE:-${ASR_DEVICE:-CPU}}
      # Diarization device. Loaded via torch.device(<value>) — PyTorch has no
      # "gpu" string (Intel GPU would need "xpu", which this component does not
      # wire), so CPU is the only valid value today. Exposed anyway so a
      # benchmark profile records it explicitly rather than leaving it implicit.
      AUDIO_ANALYZER__MODELS__DIARIZATION__DEVICE: ${DIARIZATION_DEVICE:-CPU}
    volumes:
      # Kiosk-pinned config (see ./configs/README.md) — mounted as the
      # service config without modifying edge-ai-libraries.
      - ./configs/audio-analyzer/config.yaml:/app/audio_analyzer/config.yaml:ro
      # Named volumes so the pull flow works without an edge-ai-libraries
      # clone on disk. Inspect with `docker volume inspect <name>`.
      - audio_analyzer_models:/app/audio_analyzer/models
      - audio_analyzer_chunks:/app/audio_analyzer/chunks
      - audio_analyzer_storage:/app/audio_analyzer/storage
      # Single cache mount — covers HF (HF_HOME above) AND openai-whisper's
      # ~/.cache/whisper, so no model is re-downloaded across restarts.
      - audio_analyzer_cache:/app/audio_analyzer/.cache
    # Whisper warmup on GPU can take ~120s; override the image healthcheck
    # so connection-refused during boot doesn't trip `unhealthy` and abort
    # dependent services (kiosk-core / kiosk-ui).
    healthcheck:
      test: ["CMD", "python3", "-c",
            "import urllib.request; opener = urllib.request.build_opener(urllib.request.ProxyHandler({})); opener.open('http://127.0.0.1:8010/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      start_period: 240s
      retries: 5
    restart: unless-stopped

  text-to-speech:
    # Built locally from a sibling edge-ai-libraries checkout so the Kokoro
    # TTS engine (added there, not upstream) is available. Comment out
    # `build:` and rely on `image:` alone to go back to pulling the
    # upstream prebuilt image (SpeechT5/Qwen only, no Kokoro).
    build:
      context: ../edge-ai-libraries/microservices/text-to-speech
      dockerfile: Dockerfile
    image: ${REGISTRY:-intel}/text-to-speech:${RELEASE_TAG:-latest}
    container_name: text-to-speech
    user: "1000:1000"
    ports:
      - "8011:8011"
    devices:
      - /dev/dri:/dev/dri
      # Intel NPU passthrough — same ACCEL_MOUNT_PATH mechanism as
      # audio-analyzer/rag-service/identity-service. Required before
      # TTS_DEVICE=NPU can do anything: without this the container has no
      # accel node, OpenVINO silently falls back to CPU, and the run is
      # mislabelled rather than failed. /dev/null is the inert default.
      - ${ACCEL_MOUNT_PATH:-/dev/null}:/dev/accel/accel0
    group_add:
      - video
      - "${RENDER_GID:-992}"
    environment:
      # Point HF cache under ~/.cache so a single ./.cache mount persists
      # every model cache the service uses (HF, torch hub, etc.).
      HF_HOME: /app/text-to-speech/.cache/huggingface
      # ── TTS engine selection (device-combination benchmarking) ────────────
      # These four move together and MUST stay consistent — the TTS factory
      # picks an implementation from (name, runtime) and then hands `device`
      # to it, so an inconsistent triple fails at model load, not at request
      # time. See configs/benchmark-profiles/README.md for the valid matrix.
      #
      #   Kokoro   : name=kokoro,                    runtime=kokoro,   CPU only
      #   SpeechT5 : name=microsoft/speecht5_tts,    runtime=openvino, CPU|GPU|NPU
      #   Qwen     : name=Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice,
      #                                              runtime=openvino, CPU|GPU
      #
      # Defaults reproduce the shipped config.yaml exactly, so an unset
      # environment behaves precisely as before this block existed.
      TEXT_TO_SPEECH__MODELS__TTS__NAME:            ${TTS_MODEL:-kokoro}
      TEXT_TO_SPEECH__MODELS__TTS__RUNTIME:         ${TTS_RUNTIME:-kokoro}
      TEXT_TO_SPEECH__MODELS__TTS__DEVICE:          ${TTS_DEVICE:-CPU}
      # dtype is NOT cosmetic on GPU: int8 on this iGPU measured 281s first
      # call / 8.7s steady-state vs 0.92s on CPU, while fp16 is fine after
      # warmup. Any GPU profile must set TTS_DTYPE=fp16 — validate_device_
      # profile.py enforces this so a bad pairing fails in seconds rather
      # than producing a plausible-but-wrong table 20 minutes later.
      TEXT_TO_SPEECH__MODELS__TTS__DTYPE:           ${TTS_DTYPE:-int8}
      # Voice vocabularies are per-implementation and do not overlap: Kokoro
      # wants am_michael, SpeechT5/Qwen want Ryan. Switching the model without
      # switching the speaker makes every synthesis request fail validation.
      TEXT_TO_SPEECH__MODELS__TTS__DEFAULT_SPEAKER: ${TTS_SPEAKER:-am_michael}
      TEXT_TO_SPEECH__MODELS__TTS__MODEL_VARIANT:   ${TTS_MODEL_VARIANT:-custom_voice}
      # 2 uvicorn worker PROCESSES so overlapping synth calls (e.g. a
      # speculative draft's pre-synthesis running alongside the real turn's
      # TTS) actually run concurrently instead of queueing behind Kokoro's
      # per-process inference lock — verified serialized on this box before
      # this change (2 concurrent /v1/audio/speech calls: ~1.77s, barely
      # faster than 2 sequential calls at ~1.65s). Safe on this host: 16
      # cores, each Kokoro call caps at 4 intra-op threads, and every service
      # measured near-idle CPU at rest (see docker stats). Costs one extra
      # ~1GB model load (2nd worker's cold start on its first request).
      TEXT_TO_SPEECH_WORKERS: ${TEXT_TO_SPEECH_WORKERS:-2}
    volumes:
      # Kiosk-pinned config (see ./configs/README.md) — mounted as the
      # service config without modifying edge-ai-libraries.
      - ./configs/text-to-speech/config.yaml:/app/text-to-speech/config.yaml:ro
      # Named volumes so the pull flow works without an edge-ai-libraries
      # clone on disk. Inspect with `docker volume inspect <name>`.
      - text_to_speech_models:/app/text-to-speech/models
      - text_to_speech_storage:/app/text-to-speech/storage
      # Single cache mount — see audio-analyzer block for rationale.
      - text_to_speech_cache:/app/text-to-speech/.cache
    # Model warmup on GPU can take a while; override the image healthcheck so
    # connection-refused during boot doesn't trip `unhealthy` and abort
    # dependent services (kiosk-core / kiosk-ui) via their
    # `depends_on: service_healthy` gates.
    healthcheck:
      test: ["CMD", "python3", "-c",
            "import urllib.request; opener = urllib.request.build_opener(urllib.request.ProxyHandler({})); opener.open('http://127.0.0.1:8011/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      start_period: 240s
      retries: 5
    restart: unless-stopped

  rag-service:
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    image: ${REGISTRY:-intel}/rag-service:${RELEASE_TAG:-latest}
    container_name: rag-service
    # Hardcoded to match the image's baked-in app user and the
    # ownership of the named volumes. Do not change.
    user: "1000:1000"
    ports:
      - "8020:8020"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
      - "${RENDER_GID:-992}"
    environment:
      MPLCONFIGDIR: /tmp/matplotlib
      # Skip LiteLLM's remote model-cost-map fetch (raw.githubusercontent.com)
      # on first completion() call. This deployment is offline/air-gapped, so
      # that fetch always times out (~12-15s) before falling back to the
      # local backup anyway. Our self-hosted OVMS model isn't in either map
      # (cloud or local), and nothing here reads litellm cost/limit data, so
      # forcing local removes a one-time dead wait on every rag-service
      # restart with no functional loss.
      LITELLM_LOCAL_MODEL_COST_MAP: "true"
      # Agent LLM — points at the OVMS container
      AGENT_LLM_URL:   http://ovms-llm:8000/v3
      AGENT_LLM_MODEL: ${OVMS_MODEL_NAME:-OpenVINO/Qwen3-4B-int4-ov}
      AGENT_MCP_CONFIG: /app/rag-service/agentic/resources/mcp_servers.json
      # Release complete sentences to kiosk-core as they are generated rather
      # than after the whole turn, but only for turns the agent's whole-reply
      # guards provably cannot rewrite (see _SentenceGate in ordering_agent.py).
      # Must agree with KIOSK_CORE_AGENT_STREAM_ENABLED on kiosk-core; either
      # flag alone falls back to the buffered /api/v1/agent/chat path.
      # Set AGENT_STREAM_SENTENCES=false to revert with a restart, no rebuild.
      AGENT_STREAM_SENTENCES: ${AGENT_STREAM_SENTENCES:-true}
      # Inline <act> directive instead of a structured tool call — one
      # generation carries both the cart mutation and the speech, so TTS can
      # start before generation finishes. See plugins/kiosk/directive_mode.py.
      AGENT_DIRECTIVE_MODE: ${AGENT_DIRECTIVE_MODE:-false}
      # Caps generated tokens per LLM round-trip. Decode dominates agent
      # latency, so this bounds the worst case (a turn that free-runs instead
      # of calling a tool). Generation stops at EOS, so this does NOT shorten a
      # normal turn — it only bounds the pathological one.
      #
      # Sized from measurement with the Qwen3-4B tokenizer: the longest
      # legitimate outputs are a full category listing (84 tokens) and a
      # multi-item update_order tool call (56 tokens). 128 leaves ~50% headroom
      # over both while cutting the free-run ceiling from 192.
      # Tunable from .env without a rebuild.
      AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS:-128}
      # Send MCP tool docstrings to the LLM without their "Returns:"/"Raises:"
      # sections. Those describe the payload the model receives *after* the
      # call, so they never steer tool choice or argument filling, but they were
      # re-sent as part of the tool schema on every LLM round-trip.
      # Measured: 1,627 -> 1,199 docstring tokens across the 12 kiosk tools.
      # Set AGENT_COMPACT_TOOL_DESCRIPTIONS=false to revert with a restart.
      AGENT_COMPACT_TOOL_DESCRIPTIONS: ${AGENT_COMPACT_TOOL_DESCRIPTIONS:-true}
      # Embedding + reranker models are loaded in-process via OpenVINO at
      # startup. These are intentionally decoupled from TARGET_DEVICE (which
      # only controls the ovms-llm container): both models are exported by
      # optimum-intel with dynamic (unbounded) sequence-length shapes, which
      # the NPU compiler rejects ("Missing upper bound for one or more
      # nodes"). NPU is not a supported value here — use CPU or GPU. CPU is
      # normally fast enough for embedding/reranking; GPU is the default to
      # match prior behavior. Override independently via RAG_EMBEDDING_DEVICE
      # / RAG_RERANKER_DEVICE so environments without a GPU (e.g. CI runners)
      # don't crash on startup with "[GPU] no supported devices found".
      SMART_KIOSK_RAG__MODELS__EMBEDDING__DEVICE: ${RAG_EMBEDDING_DEVICE:-GPU}
      SMART_KIOSK_RAG__RETRIEVAL__RERANKER__DEVICE: ${RAG_RERANKER_DEVICE:-GPU}
      # Retrieval recall knobs. Defaults live in rag-service/config.yaml and
      # are calibrated against the QuickBite KB; override per-deployment when
      # the knowledge base changes materially, since the reranker's logit
      # range is corpus-dependent and must be re-measured.
      SMART_KIOSK_RAG__RETRIEVAL__RERANK_SCORE_THRESHOLD: ${RAG_RERANK_THRESHOLD:--7.0}
      SMART_KIOSK_RAG__RETRIEVAL__FETCH_K: ${RAG_FETCH_K:-10}
      # Context budget handed to the agent's reply call. This is the effective
      # brake on spoken answer length: the model paraphrases whatever it is
      # given, so 2000 chars of context produced a 20-second spoken reply.
      RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-1800}
      # Force fully offline operation for HF tokenizer/model loading — the
      # tokenizer is already cached in the rag_service_hf_cache volume, and
      # newer `transformers` versions otherwise make a live Hub call
      # (list_repo_templates) even when local files exist, which crashes
      # startup when there is no network/proxy access at all.
      # Set HF_HUB_OFFLINE=0 / TRANSFORMERS_OFFLINE=0 in .env if this
      # environment has working internet/proxy access and you want live
      # Hub checks (e.g. picking up a newly-released model revision).
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      # Bypass corporate proxy for all intra-cluster traffic so that
      # requests to ovms-llm, kiosk-core, etc. go directly on the
      # Docker bridge network instead of through the Intel proxy.
      NO_PROXY: "localhost,127.0.0.1,ovms-llm,kiosk-core,audio-analyzer,text-to-speech,metrics-collector,rag-service,172.16.0.0/12,10.0.0.0/8"
      no_proxy: "localhost,127.0.0.1,ovms-llm,kiosk-core,audio-analyzer,text-to-speech,metrics-collector,rag-service,172.16.0.0/12,10.0.0.0/8"
      # Domain-specific config (identity, intent rules, reply templates) is
      # mounted from the consuming application rather than baked into the image.
      # Non-kiosk deployments override this path (or leave it unset for
      # generic RAG-only mode).
      RAG_DOMAIN_CONFIG_PATH: /app/rag-service/domain-config/agent_profile.yaml
      # Enable or disable the ordering-agent subsystem. Set to "false" for
      # pure-RAG deployments (healthcare, education) to skip MCP bootstrap.
      ORDERING_AGENT_ENABLED: ${ORDERING_AGENT_ENABLED:-true}
      # Lab-only ADK vs non-ADK A/B route (/api/v1/agent/chat-no-adk), used
      # solely by tests/benchmarks/*_no_adk.py. Off by default: it can place
      # real orders and must never be reachable in a normal deployment. Set
      # to "true" only when running those specific benchmark scripts.
      AGENT_BENCHMARK_ENDPOINTS_ENABLED: ${AGENT_BENCHMARK_ENDPOINTS_ENABLED:-false}
    volumes:
      - rag_service_models:/app/rag-service/models
      - rag_service_storage:/app/rag-service/storage
      - rag_service_hf_cache:/app/rag-service/.cache/huggingface
      # Mount kiosk-specific domain config into the container.
      # Generic image → kiosk-aware at runtime via this mount.
      - ./configs/rag-service:/app/rag-service/domain-config:ro
      # Mount kiosk domain plugins (ordering agent, guards) from the consuming
      # application. The rag-service image has an empty plugins/ mount point;
      # all domain Python code lives here in the smart-kiosk-assistant repo.
      # When rag-service moves to edge-ai-libraries, only this line changes.
      - ./plugins:/app/rag-service/plugins:ro
    # start_period covers first-run model download + OpenVINO INT8 export
    # (~2-3 min for Qwen3-4B + embeddings + reranker). Cached runs are fast.
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      start_period: 600s
      retries: 10
    restart: unless-stopped

  # OVMS — serves Qwen3-4B-int4-ov for the ordering agent (ADK → LiteLLM → OVMS).
  #
  # Uses OVMS pull mode: if ./models/OpenVINO/Qwen3-4B-int4-ov/ is present
  # (pre-downloaded by setup_models.sh) the model loads from disk; otherwise
  # OVMS pulls it from HuggingFace on first start.
  #
  # Pre-download recommended:
  #   ./setup_models.sh            # GPU (default)
  #   ./setup_models.sh --device CPU
  #
  # Why OpenVINO/Qwen3-4B-int4-ov + hermes3?
  #   Pre-converted INT4 (~2 GB) with native tool-calling support per
  #   https://docs.openvino.ai/2026/model-server/ovms_demos_continuous_batching_agent.html
  #
  # OVMS_TOOL_PARSER must match the model's chat template, not just the vendor:
  #   hermes3 -> Qwen3.x / Qwen2.5      qwen3coder -> Qwen3.5+ (XML tool syntax)
  #   gemma4  -> Gemma 4                phi4       -> Phi-4
  # Setting it to `none` disables parsing; omitting the flag lets OVMS auto-detect
  # from the chat template. A mismatched parser silently drops every tool call.
  #
  # OVMS_TOOL_GUIDED constrains decoding to the tool JSON schema. It is the main
  # mitigation for small models emitting raw tool-result JSON instead of prose.
  # Tested (Qwen3-4B-int4, this deployment): a controlled A/B at the real agent
  # endpoint showed no TTFT improvement over unguided decoding (grammar-
  # constraint overhead offsets any preamble-token savings). Left disabled
  # (default false); revisit if a future model shows raw-JSON leakage.
  #
  # Speculative decoding (--draft_source_model, a Qwen3-0.6B draft model) was
  # benchmarked and REJECTED — see
  # tests/benchmarks/results/replay-qwen3-4b-specdecode.json for the (~4%,
  # noise-level) latency result. Worse: it broke streamed tool-call argument
  # delivery outright. With the draft model attached, OVMS's streaming
  # response emits the tool call's arguments as a single truncated chunk
  # (e.g. ``{"category":``) and immediately closes the stream with
  # ``finish_reason: "tool_calls"``, instead of the correct multi-chunk
  # incremental arguments that non-speculative streaming produces. This
  # surfaced in production as every voice turn that should have called a tool
  # (e.g. "I would like to explore different type of burgers") replying
  # "Sorry, I encountered an error" — a JSONDecodeError parsing the truncated
  # arguments. Confirmed via a raw curl to /v3/chat/completions with
  # stream=true, comparing with and without --draft_source_model. Do not
  # re-add this flag without first confirming OVMS has fixed streamed
  # tool-call + speculative-decoding interaction upstream.
  # OVMS's named cache volume (ovms_ov_cache below) is created by Docker on
  # first use, owned by root:root 0755 — but ovms-llm's image runs as a
  # non-root "ovms" user (uid 5000), which then cannot write into it.
  # Confirmed live: "Cache directory /tmp/ov_cache is not writable; access()
  # result: -1" on every ovms-llm startup, silently defeating OV_CACHE_DIR /
  # --cache_dir and forcing a full model-IR recompile on every restart
  # instead of a cache hit. This one-shot init chowns the volume to the
  # container's uid before ovms-llm starts; it runs once per `up` (fast,
  # no-op on a volume that is already owned correctly) and exits, gating
  # ovms-llm via depends_on/service_completed_successfully below.
  ovms-cache-init:
    image: busybox
    container_name: ovms-cache-init
    user: root
    volumes:
      - ovms_ov_cache:/tmp/ov_cache
    command: chown -R 5000:5000 /tmp/ov_cache

  ovms-llm:
    image: openvino/model_server:latest-gpu
    container_name: ovms-llm
    depends_on:
      ovms-cache-init:
        condition: service_completed_successfully
    ports:
      - "9001:9000"  # gRPC (host 9001 avoids conflict with metrics-collector:9000)
      - "8000:8000"  # REST / OpenAI-compatible /v3
    devices:
      - /dev/dri:/dev/dri
      # Intel NPU passthrough — same ACCEL_MOUNT_PATH mechanism as audio-analyzer
      # and queue-service. Defaults to /dev/null (no-op) on hosts without an NPU.
      - ${ACCEL_MOUNT_PATH:-/dev/null}:/dev/accel/accel0
    group_add:
      - video
      - "${RENDER_GID:-992}"
    volumes:
      # Bind-mount pre-downloaded models directory (populated by setup_models.sh).
      # OVMS will pull from HuggingFace on first run if the directory is empty.
      - ./models:/models
      # OpenVINO compilation cache — avoids re-compiling IR on every startup
      - ovms_ov_cache:/tmp/ov_cache
    environment:
      OV_CACHE_DIR: /tmp/ov_cache
      # Required for Level Zero to enumerate the Intel NPU. Harmless when no
      # NPU node is mapped — OpenVINO then reports CPU/GPU only.
      ZE_ENABLE_ALT_DRIVERS: libze_intel_npu.so
    # --max_num_batched_tokens is the prefill chunk budget. Raising it to 8192
    # was tried (rationale: with the Qwen3-4B tokenizer the static part of every
    # agent prompt measured 4,206 tokens — 1,509 agent instruction + ~2,697 MCP
    # tool schemas — so at 4096 every call was split into multiple chunked
    # prefill iterations). Measured on an Arc iGPU it produced NO improvement:
    # isolated agent turn 2,306 ms at 8192 vs 2,277 ms at 4096, and a 6-turn
    # conversation replay gave an LLM median of 5,869 ms vs 5,951 ms — both
    # within run-to-run noise. Tool-description compaction
    # (AGENT_COMPACT_TOOL_DESCRIPTIONS) already pulls the static prefill back
    # under 4096, which makes the larger budget redundant. Kept at the upstream
    # default; revisit only if the prompt grows materially again.
    command: >
      --rest_port 8000
      --port 9000
      --source_model ${OVMS_MODEL_NAME:-OpenVINO/Qwen3-4B-int4-ov}
      --model_repository_path /models
      --task text_generation
      --tool_parser ${OVMS_TOOL_PARSER:-hermes3}
      --enable_tool_guided_generation ${OVMS_TOOL_GUIDED:-false}
      --target_device ${TARGET_DEVICE:-GPU}
      --cache_dir /tmp/ov_cache
      --enable_prefix_caching ${OVMS_PREFIX_CACHING:-true}
      --cache_size ${OVMS_KV_CACHE_GB:-4}
      --max_num_seqs ${OVMS_MAX_NUM_SEQS:-4}
      --max_num_batched_tokens ${OVMS_MAX_BATCHED_TOKENS:-4096}
      --plugin_config '{"PERFORMANCE_HINT":"LATENCY"}'
      --metrics_enable
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/v3/models"]
      interval: 20s
      timeout: 10s
      start_period: 300s
      retries: 10
    restart: unless-stopped

  kiosk-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${REGISTRY:-intel}/kiosk-core:${RELEASE_TAG:-latest}
    container_name: kiosk-core
    user: "1000:1000"
    ports:
      - "8012:8012"
    environment:
      KIOSK_CORE_ANALYZER_URL: http://audio-analyzer:8010/v1/audio/transcriptions
      KIOSK_CORE_RAG_URL:      http://rag-service:8020/api/v1/query
      KIOSK_CORE_TTS_URL:      http://text-to-speech:8011/v1/audio/speech
      # "Ryan" was the SpeechT5/Qwen-era default (US English male, bright and
      # projecting). The engine has since moved to Kokoro (see
      # ASR language hint sent with every file-path transcription request.
      #
      # Defaults to EMPTY, deliberately. The default ASR checkpoint is
      # distil-whisper/distil-small.en (see ASR_MODEL above), which is
      # English-only: audio-analyzer turns any language value into an <|en|>
      # token, and an English-only Whisper rejects it with
      # "Cannot specify 'language' for not multilingual model" -> HTTP 500
      # and an empty transcript on every single turn. config.py's own
      # default is "en" (correct for a multilingual checkpoint run outside
      # Docker), so this line both overrides it to match the shipped model
      # AND makes the variable settable from .env at all -- compose uses an
      # explicit environment: allowlist, so without this line
      # KIOSK_CORE_ASR_LANGUAGE= in .env had no effect whatsoever.
      #
      # Uses ${VAR-} (no colon) so an explicitly-empty value in .env is
      # passed through as empty rather than falling back to a default.
      # Set to "en" only alongside a multilingual ASR_MODEL.
      KIOSK_CORE_ASR_LANGUAGE: ${KIOSK_CORE_ASR_LANGUAGE-}
      # configs/text-to-speech/config.yaml), which has no "Ryan" voice — this
      # override was left stale after that migration and made EVERY TTS
      # request 400 (silent replies) until this fix. am_michael is Kokoro's
      # closest match to the old Ryan voice and matches config.yaml's own
      # default_speaker, so this override is now redundant but kept explicit
      # per the original rationale: visible here, swappable without touching
      # config.yaml. Full Kokoro voice list is in configs/text-to-speech/config.yaml.
      KIOSK_CORE_TTS_VOICE:    am_michael
      # kiosk_core.config.DEFAULT_TTS_MODEL falls back to "qwen-tts" when this
      # is unset. TtsClient sends whatever this resolves to as the model name
      # on every request, and the TTS backend now matches by substring on
      # "kokoro" (components/tts/kokoro/kokoro_tts.py::matches_model_name) —
      # without this override every request would ask for qwen-tts against a
      # service now configured for the kokoro runtime.
      KIOSK_CORE_TTS_MODEL:    kokoro
      # ── Pre-synthesized opener ────────────────────────────────────────
      # An ordering turn's reply is templated only after the tool returns, so
      # the model emits no prose to stream and the customer hears ~2s of
      # silence while the tool-call JSON is generated. A short, cached phrase
      # is played immediately to fill that window. Must stay non-committal —
      # it is spoken before any tool has run. Set ENABLED=false to disable.
      KIOSK_CORE_OPENER_ENABLED: ${KIOSK_CORE_OPENER_ENABLED:-true}
      KIOSK_CORE_OPENER_TEXT:    ${KIOSK_CORE_OPENER_TEXT:-One moment.}
      # Adaptive endpoint: shorten the end-of-turn wait when the transcript
      # already reads as a finished sentence. Fails closed to
      # KIOSK_CORE_SILENCE_TIMEOUT_SECONDS when no transcript has arrived.
      KIOSK_CORE_ENDPOINT_COMPLETE_ENABLED: ${KIOSK_CORE_ENDPOINT_COMPLETE_ENABLED:-true}
      # 0.15s (kiosk-voice-lab-main parity) — see config.py's
      # DEFAULT_ENDPOINT_SHORT_SECONDS docstring: inert until continuous ASR
      # replaces the flush-on-pause design (currently gated by
      # KIOSK_CORE_ADAPTIVE_FLUSH_PAUSE_SECONDS=0.50).
      KIOSK_CORE_ENDPOINT_SHORT_SECONDS:    ${KIOSK_CORE_ENDPOINT_SHORT_SECONDS:-0.15}
      KIOSK_CORE_ENDPOINT_MIN_WORDS:        ${KIOSK_CORE_ENDPOINT_MIN_WORDS:-3}
      # Same explicit-allowlist gotcha as ADAPTIVE_FLUSH_PAUSE_SECONDS below:
      # setting this in .env alone does nothing without this line. Trimmed
      # from the 0.2s code default to 0.15s so short+stable totals ~0.30s
      # (down from ~0.35s), keeping ~30-50ms of margin above
      # KIOSK_CORE_ADAPTIVE_FLUSH_PAUSE_SECONDS=0.30 (the real commit must
      # still win the race -- see that var's comment below).
      KIOSK_CORE_ENDPOINT_STABLE_SECONDS:  ${KIOSK_CORE_ENDPOINT_STABLE_SECONDS:-0.2}
      # Was previously never actually wired through from .env to the
      # container (only referenced in a comment above) — this compose file
      # uses an explicit environment: allowlist, not a blanket .env
      # passthrough, so every KIOSK_CORE_* override needs its own line here
      # regardless of what .env sets. Lowered from the 0.50s code default:
      # in streaming sessions the endpoint-completeness shortcut fires at
      # ~0.35-0.40s (ENDPOINT_SHORT_SECONDS + ENDPOINT_STABLE_SECONDS),
      # before the 0.50s adaptive-pause real commit ever got a chance to
      # run — so the real, diarized commit never fired mid-utterance and
      # the mandatory final-chunk flush had to transcribe the WHOLE
      # utterance from scratch every turn (the dominant cost in
      # WallTimes.final_flush_wait_ms, observed 250-600ms). Set below the
      # shortcut's firing point so the real commit wins the race instead.
      KIOSK_CORE_ADAPTIVE_FLUSH_PAUSE_SECONDS: ${KIOSK_CORE_ADAPTIVE_FLUSH_PAUSE_SECONDS:-0.30}
      # Tier 2 roadmap item #4 (cumulative-snapshot ASR), adapted: skip the
      # final tail-chunk ASR call when it holds no unflushed speech (pure
      # trailing silence — the adaptive-pause flush already sent every real
      # word). Default off pending live A/B measurement; see config.py for
      # the full rationale (DEFAULT_SKIP_EMPTY_FINAL_FLUSH_ENABLED).
      KIOSK_CORE_SKIP_EMPTY_FINAL_FLUSH_ENABLED: ${KIOSK_CORE_SKIP_EMPTY_FINAL_FLUSH_ENABLED:-false}
      # ASR trailing-silence trim (kiosk-voice-lab-main parity): trims the
      # audio actually SENT TO ASR down to "last speech + a short decay tail"
      # before every adaptive-pause/final flush, to stop Whisper hallucinating
      # a completion word from dangling speech + silence (measured artifact:
      # a spurious trailing "Good."). Does not touch endpoint/silence-timeout
      # timing. Default off pending live A/B; see config.py for the full
      # rationale (DEFAULT_ASR_TRIM_TRAILING_SILENCE_ENABLED).
      KIOSK_CORE_ASR_TRIM_TRAILING_SILENCE_ENABLED: ${KIOSK_CORE_ASR_TRIM_TRAILING_SILENCE_ENABLED:-false}
      KIOSK_CORE_ASR_TRIM_DECAY_SECONDS:             ${KIOSK_CORE_ASR_TRIM_DECAY_SECONDS:-0.15}
      # Speculative drafting (see DEFAULT_SPECULATIVE_DRAFT_ENABLED in
      # config.py for the full rationale/safety notes — dry_run-guarded,
      # newest-wins). Was defaulted OFF after a 2026-09-08 live-replay
      # regression (5.8s -> 38.2s) traced to the TTS backend serializing
      # requests. Re-tested 2026-09-09 AFTER fixing that (text-to-speech now
      # runs TEXT_TO_SPEECH_WORKERS=2, verified concurrent — 2 parallel synth
      # calls dropped from ~1.77s to ~1.18s — and OVMS/rag-service confirmed
      # to already serve concurrent agent/chat calls). Still net NEGATIVE on
      # this fixture: 3-run mean rose from 3839ms to 4061ms (+222ms). Root
      # cause: exact-string draft-cache matching almost never hits — ASR
      # trailing noise (e.g. a spurious "Good." segment appended after the
      # real sentence) means the final transcript rarely matches any single
      # earlier preview snapshot the draft ran against, so every draft/TTS
      # presynth call in this test was 100% wasted work that still competed
      # with the real turn's own LLM/TTS calls for the same backends. Keep
      # OFF until draft-cache matching is made fuzzy/prefix-tolerant instead
      # of exact-string, then re-benchmark before flipping to true.
      KIOSK_CORE_SPECULATIVE_DRAFT_ENABLED: ${KIOSK_CORE_SPECULATIVE_DRAFT_ENABLED:-false}
      KIOSK_CORE_SPECULATIVE_TTS_PRESYNTH_ENABLED: ${KIOSK_CORE_SPECULATIVE_TTS_PRESYNTH_ENABLED:-false}
      KIOSK_CORE_METRICS_URL:  http://metrics-collector:9000
      # Diarization — re-enable once HF terms are accepted for pyannote models.
      # Accept terms at: https://huggingface.co/pyannote/speaker-diarization-community-1
      #                  https://huggingface.co/pyannote/speaker-diarization-3.1
      #                  https://huggingface.co/pyannote/segmentation-3.0
      # Was hardcoded to "true" here, which silently ignored any
      # KIOSK_CORE_DIARIZATION_ENABLED=false set in the shell/.env — only
      # audio-analyzer's AUDIO_ANALYZER__MODELS__ASR__DIARIZATION override
      # (below, in the audio-analyzer service) actually read the variable.
      # Parameterized so setting the env var once takes effect on both
      # services (e.g. as a fallback toggle if diarization ever needs to be
      # disabled in an environment where the pyannote model cache is
      # genuinely incomplete). Under normal offline operation, diarization
      # should stay enabled — see the HF_HUB_OFFLINE/TRANSFORMERS_OFFLINE
      # vars on audio-analyzer above, which are the actual fix for pyannote
      # loading fully offline from its already-complete local cache.
      KIOSK_CORE_DIARIZATION_ENABLED: ${KIOSK_CORE_DIARIZATION_ENABLED:-true}
      # Silero VAD (v5, onnxruntime): model-based replacement for the adaptive
      # RMS VAD's speech/silence decision. Default ON — every turn timer (the
      # 0.50s adaptive flush, the sentence-completeness shortcut and the 1.1s
      # silence endpoint) starts from the frame the VAD first calls silence, so
      # a loudness gate that declares silence late in a noisy room delays the
      # whole turn. See DEFAULT_SILERO_VAD_* in kiosk_core/config.py for the
      # full writeup and kiosk_core/silero_vad.py for the wrapper. Fails open to
      # the RMS VAD. Set to false to restore the RMS-only path.
      KIOSK_CORE_SILERO_VAD_ENABLED: ${KIOSK_CORE_SILERO_VAD_ENABLED:-true}
      # Continuous ASR streaming: PCM frames sent over a persistent WebSocket
      # to audio-analyzer's /v1/realtime instead of POSTing a WAV file per
      # flush, so a fresh transcript is available throughout speech (not
      # just after a pause begins). This is what lets the sentence-
      # completeness shortcut (KIOSK_CORE_ENDPOINT_SHORT_SECONDS) actually
      # fire early instead of falling through to the full silence-timeout
      # wait most turns. Falls back to the file-POST path per-session if the
      # socket fails to connect — never fails the turn. Default OFF.
      KIOSK_CORE_ANALYZER_STREAMING_ENABLED: ${KIOSK_CORE_ANALYZER_STREAMING_ENABLED:-false}
      # Consecutive rejected turns (speaker filter dropped every segment as
      # non-primary) required before the kiosk speaks
      # KIOSK_CORE_UNRECOGNIZED_SPEAKER_PROMPT instead of staying silent.
      # Default upstream is 2 (tolerate a one-off Whisper hallucination/TTS
      # echo). Observed live in this offline deployment: the primary speaker
      # lock flips mid-conversation (diarization/embedding instability), so a
      # single genuine question gets silently dropped with zero feedback
      # before a 2nd consecutive rejection ever happens. Set to 1 here so the
      # customer is never left in silence — see kiosk_core/config.py for the
      # full trade-off.
      KIOSK_CORE_CONSECUTIVE_REJECTION_THRESHOLD: ${KIOSK_CORE_CONSECUTIVE_REJECTION_THRESHOLD:-2}
      # Ordering & agent routing
      KIOSK_CORE_ORDERING_ENABLED: "true"
      KIOSK_CORE_AGENT_URL:        http://rag-service:8020/api/v1/agent/chat
      # Consume the agent's streaming endpoint so TTS synthesis overlaps with
      # generation instead of waiting for the whole turn. Measured on a
      # multi-sentence menu reply: time-to-first-audio 6.8s -> 5.2s, turn total
      # 12.9s -> 11.1s. Single-sentence replies see little change, since most
      # of the latency is tool calls and retrieval rather than token emission.
      # Driven by the same var as AGENT_STREAM_SENTENCES on rag-service; the
      # two must agree, and either alone falls back to the buffered path.
      KIOSK_CORE_AGENT_STREAM_ENABLED: ${AGENT_STREAM_SENTENCES:-true}
      KIOSK_CORE_DB_PATH:          /app/data/kiosk.db
      KIOSK_CORE_PRODUCTS_YAML:    /app/configs/ordering/products.yaml
      KIOSK_CORE_UPSELL_RULES_YAML: /app/configs/ordering/upsell_rules.yaml
      # Identity / biometric auth feature (app-layer flag). Set to "true" AND
      # start with `--profile identity` to bring up the identity-service.
      KIOSK_CORE_IDENTITY_ENABLED: "${KIOSK_CORE_IDENTITY_ENABLED:-false}"
      KIOSK_CORE_IDENTITY_URL:     http://identity-service:8013
      # Queue-service integration (dynamic peak-hour menu)
      KIOSK_CORE_QUEUE_SERVICE_ENABLED: "${KIOSK_CORE_QUEUE_SERVICE_ENABLED:-true}"
      KIOSK_CORE_QUEUE_SERVICE_URL:     http://queue-service:8090
      # Conversation recording (offline analysis). Off by default; set to
      # "true" to append every completed voice turn to
      # ./conversations/<conversation_id>.jsonl on the host (bind-mounted
      # below, so files are inspectable without entering the container).
      KIOSK_CORE_CONVERSATION_LOGGING_ENABLED: "${KIOSK_CORE_CONVERSATION_LOGGING_ENABLED:-false}"
      KIOSK_CORE_CONVERSATION_LOG_DIR:          /app/conversations
      # VLM metrics logging (kiosk_core.vlm_metrics_logger, vendored from
      # performance-tools). On by default -- pure side-channel append-only
      # log write, guarded by its own try/except (see
      # audio_session._emit_vlm_metrics), so it can never break a live turn.
      # CONTAINER_RESULTS_PATH and USECASE_V2V are upstream-fixed env var
      # names the vendored logger itself reads (see config.py's
      # VLM_METRICS_RESULTS_DIR/VLM_METRICS_USECASE_ENV_VAR comments) -- kept
      # as-is so files land in the same ./results the benchmark flow's
      # consolidate-metrics/plot-metrics targets already scan.
      KIOSK_CORE_VLM_METRICS_ENABLED: "${KIOSK_CORE_VLM_METRICS_ENABLED:-true}"
      CONTAINER_RESULTS_PATH: /app/results
      USECASE_V2V: smart-kiosk-v2v
      # Bypass corporate proxy for intra-cluster traffic
      NO_PROXY: "localhost,127.0.0.1,ovms-llm,kiosk-core,audio-analyzer,text-to-speech,metrics-collector,rag-service,queue-service,172.16.0.0/12,10.0.0.0/8"
      no_proxy: "localhost,127.0.0.1,ovms-llm,kiosk-core,audio-analyzer,text-to-speech,metrics-collector,rag-service,queue-service,172.16.0.0/12,10.0.0.0/8"
    volumes:
      - generated_audio:/app/generated_audio
      - kiosk_db:/app/data
      - ./configs/ordering:/app/configs/ordering:ro
      - ./conversations:/app/conversations
      - ${KIOSK_RESULTS_HOST_DIR:-./results}:/app/results
    depends_on:
      audio-analyzer:
        condition: service_healthy
      text-to-speech:
        condition: service_healthy
      rag-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8012/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # identity-service: multimodal biometric authentication (Face ID + Voiceprint).
  #
  # Gated behind the `identity` compose profile (container-layer flag) — it only
  # starts when you run, e.g.:
  #     KIOSK_CORE_IDENTITY_ENABLED=true docker compose --profile identity up -d
  # The app-layer flag KIOSK_CORE_IDENTITY_ENABLED tells kiosk-core to call it.
  #
  # Shares the same kiosk_db volume as kiosk-core (loyalty_profiles table lives
  # in kiosk.db). FAISS indices live in the separate identity_data volume.
  # ---------------------------------------------------------------------------
  identity-service:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    image: ${REGISTRY:-intel}/identity-service:${RELEASE_TAG:-latest}
    container_name: identity-service
    profiles: ["identity"]
    user: "1000:1000"
    ports:
      - "8013:8013"
    devices:
      - /dev/dri:/dev/dri
      # Intel NPU passthrough — same ACCEL_MOUNT_PATH mechanism as audio-analyzer
      # and queue-service. Defaults to /dev/null (no-op) on hosts without an NPU.
      - ${ACCEL_MOUNT_PATH:-/dev/null}:/dev/accel/accel0
    group_add:
      - video
      - "${RENDER_GID:-992}"
    environment:
      BOOTSTRAP_ON_START:        "${BOOTSTRAP_ON_START:-true}"
      IDENTITY_DB_PATH:          /app/data/kiosk.db
      IDENTITY_FAISS_DIR:        /app/data/identity
      IDENTITY_MODELS_DIR:       /app/models
      IDENTITY_DEVICE:           "${IDENTITY_DEVICE:-GPU}"
      IDENTITY_CONFIG_YAML:      /app/configs/identity/identity_config.yaml
      IDENTITY_PROMPTS_YAML:     /app/configs/identity/verification_prompts.yaml
      # Required for Level Zero to enumerate the Intel NPU. Harmless when no
      # NPU node is mapped — OpenVINO then reports CPU/GPU only.
      ZE_ENABLE_ALT_DRIVERS:     libze_intel_npu.so
      NO_PROXY: "localhost,127.0.0.1,ovms-llm,kiosk-core,audio-analyzer,text-to-speech,metrics-collector,rag-service,identity-service,172.16.0.0/12,10.0.0.0/8"
      no_proxy: "localhost,127.0.0.1,ovms-llm,kiosk-core,audio-analyzer,text-to-speech,metrics-collector,rag-service,identity-service,172.16.0.0/12,10.0.0.0/8"
    volumes:
      # Shared SQLite DB (same file kiosk-core uses).
      - kiosk_db:/app/data
      # FAISS indices live alongside the DB volume but in their own subdir.
      - identity_data:/app/data/identity
      # Pinned config (challenge prompts + bootstrap profiles).
      - ./configs/identity:/app/configs/identity:ro
      # OpenVINO models (face detection/reid, ECAPA-TDNN voice).
      - ./models:/app/models
      # Sample enrolment data for bootstrap profiles.
      - ./identity-service/sample-data:/app/sample-data:ro
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8013/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 5
    restart: unless-stopped

  # Operator/demo screen — chat transcript, performance dashboard, device &
  # knowledge-base settings, QSR tab. Shown on the monitor facing staff/demo
  # audience. KIOSK_UI_MODE is intentionally omitted here: the image defaults
  # to 'operator' (see src/uiMode.ts) so this behaves exactly as before.
  kiosk-ui:
    build:
      context: ./kiosk-ui
      dockerfile: Dockerfile
    image: ${REGISTRY:-intel}/kiosk-ui:${RELEASE_TAG:-latest}
    container_name: kiosk-ui
    ports:
      - "7860:7860"
    environment:
      KIOSK_CORE_UI_BASE_URL:     http://kiosk-core:8012
      KIOSK_CORE_UI_ANALYZER_URL: http://audio-analyzer:8010/v1/audio/transcriptions
      KIOSK_CORE_UI_RAG_URL:      http://rag-service:8020/api/v1/query
      KIOSK_CORE_UI_TTS_URL:      http://text-to-speech:8011/v1/audio/speech
    volumes:
      - generated_audio:/app/generated_audio
    depends_on:
      kiosk-core:
        condition: service_healthy
    restart: unless-stopped

  # Customer-facing screen — single-view menu (queue-driven) + cart + voice
  # "Ask" button, for the physical kiosk touchscreen. Reuses the exact same
  # image/build as kiosk-ui; only KIOSK_UI_MODE and the published port differ,
  # so the two screens can never drift out of sync with each other's backend
  # wiring. No separate build context or Dockerfile.
  kiosk-ui-customer:
    image: ${REGISTRY:-intel}/kiosk-ui:${RELEASE_TAG:-latest}
    container_name: kiosk-ui-customer
    ports:
      - "7861:7860"
    environment:
      KIOSK_UI_MODE:              customer
      KIOSK_CORE_UI_BASE_URL:     http://kiosk-core:8012
      KIOSK_CORE_UI_ANALYZER_URL: http://audio-analyzer:8010/v1/audio/transcriptions
      KIOSK_CORE_UI_RAG_URL:      http://rag-service:8020/api/v1/query
      KIOSK_CORE_UI_TTS_URL:      http://text-to-speech:8011/v1/audio/speech
    volumes:
      - generated_audio:/app/generated_audio
    depends_on:
      kiosk-core:
        condition: service_healthy
      kiosk-ui:
        condition: service_started
    restart: unless-stopped

volumes:
  generated_audio:
  audio_analyzer_models:
  audio_analyzer_chunks:
  audio_analyzer_storage:
  audio_analyzer_cache:
  text_to_speech_models:
  text_to_speech_storage:
  text_to_speech_cache:
  rag_service_models:
  rag_service_storage:
  rag_service_hf_cache:
  kiosk_db:
  # FAISS biometric indices for identity-service (face_index.bin / voice_index.bin)
  identity_data:
  # OpenVINO compilation cache for ovms-llm — avoids re-compiling model IR on restart
  ovms_ov_cache:
