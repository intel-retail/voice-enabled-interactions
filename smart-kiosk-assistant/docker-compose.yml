# docker-compose.yml
#
# Starts audio-analyzer, text-to-speech, rag-service, kiosk-core, and kiosk-ui.
# Mic audio is captured by the browser via Web Audio API and uploaded as a
# file -- no host mic passthrough into the container is required.
#
# audio-analyzer and text-to-speech live in the separate edge-ai-libraries
# repository and have no local build context here — they are always pulled
# pre-built from Docker Hub using the image tags declared below.
#
# Pull (default):   docker compose pull && docker compose up -d
# Build from src:   docker compose build && docker compose up -d
# Stop:             docker compose down
# Logs:             docker compose logs -f

services:

  # ---------------------------------------------------------------------------
  # rtsp-streamer: publishes either bundled sample clips or a live webcam as
  # an RTSP stream via MediaMTX + ffmpeg (see ./rtsp-streamer/start.sh).
  #
  # Stream path is set by STREAM_NAME (see rtsp-streamer environment below).
  # Default: rtsp://rtsp-streamer:8554/queue
  #
  # Feeds the queue-service person-counting pipeline (queue-service/).
  # ---------------------------------------------------------------------------
  rtsp-streamer:
    build:
      context: ./rtsp-streamer
      dockerfile: Dockerfile
    image: ${REGISTRY:-intel}/rtsp-streamer:${RELEASE_TAG:-latest}
    container_name: rtsp-streamer
    user: "1000:1000"
    ports:
      - "8554:8554"
    environment:
      RTSP_SOURCE_MODE: ${RTSP_SOURCE_MODE:-sample}  # "sample" or "live" (see .env)
      MEDIA_DIR:      /media
      # Sample mode uses the existing MEDIA_FILES / MEDIA_FILE branches.
      # The bundled clips are mounted from ./Sample_data into /media.
      MEDIA_FILES:    ${MEDIA_FILES:-sample_1.mp4,sample_2.mp4}
      # Live mode reads from this V4L2 node. Sample mode ignores this value.
      CAMERA_DEVICE:  ${CAMERA_DEVICE:-}
      STREAM_NAME:    ${STREAM_NAME:-queue}
      RTSP_PORT:      "8554"
      LOOP_COUNT:     "-1"      # -1 = infinite loop for a continuous feed
      BLANK_DURATION: "0"       # seconds of black frames between loops
      NO_PROXY: "localhost,127.0.0.1,rtsp-streamer,queue-management,kiosk-core"
      no_proxy: "localhost,127.0.0.1,rtsp-streamer,queue-management,kiosk-core"
    # Compose cannot conditionally include devices. RTSP_CAMERA_DEVICE is
    # therefore resolved outside compose:
    #   sample mode -> /dev/null (safe on systems without a camera)
    #   live mode   -> CAMERA_DEVICE (validated by check-env/start.sh)
    devices:
      - ${RTSP_CAMERA_DEVICE:-/dev/null}:${RTSP_CAMERA_DEVICE:-/dev/null}
    group_add:
      - video
    volumes:
      - ./rtsp-streamer/start.sh:/opt/rtsp-streamer/start.sh:ro
      - ./Sample_data:/media:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8554"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # queue-service: YOLOv8 + OpenVINO person-counting pipeline.
  #
  # Reads the RTSP stream from rtsp-streamer, runs person detection + tracking,
  # counts people in a configurable ROI, and exposes:
  #   GET /api/v1/queue/count  — JSON { count, status, timestamp }
  #   GET /stream              — MJPEG video with bounding-box overlay
  #
  # The kiosk-ui nginx proxy routes /queue-svc/* → http://queue-service:8090/
  # ---------------------------------------------------------------------------
  queue-service:
    build:
      context: ./queue-service
      dockerfile: docker/Dockerfile
    image: ${REGISTRY:-intel}/queue-service:${RELEASE_TAG:-latest}
    container_name: queue-service
    user: "1000:1000"
    ports:
      - "8090:8090"
    environment:
      # Derive RTSP URL from the same STREAM_NAME that rtsp-streamer publishes,
      # so changing the media file in one place keeps the pipeline in sync.
      QUEUE_SERVICE__SOURCE__RTSP_URL: "rtsp://rtsp-streamer:8554/${STREAM_NAME:-queue}"
      # Inference device for the YOLO26 person detector. Defaults to CPU
      # (see queue-config.yaml `model.device` for rationale). Override via
      # QUEUE_DEVICE=GPU|NPU in .env once the target platform supports it —
      # no rebuild required.
      QUEUE_SERVICE__MODEL__DEVICE: ${QUEUE_DEVICE:-CPU}
      NO_PROXY: "localhost,127.0.0.1,rtsp-streamer,queue-service"
      no_proxy: "localhost,127.0.0.1,rtsp-streamer,queue-service"
      ZE_ENABLE_ALT_DRIVERS: libze_intel_npu.so
    volumes:
      - ./queue-service/conf:/app/queue-service/conf:ro
      # models/ is NOT mounted — the IR is baked into the image at build time.
      # Run ./setup_models.sh first to download yolo26n IR to queue-service/models/,
      # then docker compose build to bake it in. See setup_models.sh for details.
      - ./queue-service/src:/app/queue-service/src:ro
    devices:
      - /dev/dri:/dev/dri
      - ${ACCEL_MOUNT_PATH:-/dev/null}:/dev/accel/accel0
    group_add:
      - video
      - "${RENDER_GID:-992}"
    depends_on:
      rtsp-streamer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # metrics-collector: OS-level hardware utilization collector.
  # Built on intel/retail-benchmark which provides supervisord, qmassa (Intel
  # GPU), Intel NPU tool, Intel PCM (power), sar (CPU), and free (memory).
  #
  # Endpoints (reachable by other containers as http://metrics-collector:9000):
  #   GET /health         -> liveness probe
  #   GET /metrics        -> cpu/gpu/npu/memory/power time-series JSON
  #   GET /platform-info  -> processor, iGPU, NPU, memory, storage summary
  #   GET /memory         -> latest memory snapshot
  # ---------------------------------------------------------------------------
  metrics-collector:
    # Pulled, not built. The source of truth for this image now lives in the
    # edge-ai-suites repo (health-and-life-sciences-ai-suite/
    # multi_modal_patient_monitoring/services/metrics-collector), shared with
    # the multi-modal patient monitoring suite.
    #
    # This service was previously built locally from ./kiosk_core/metrics-
    # collector because the then-published hl-ai-metrics-collector:2026.1.0
    # image predated the current source tree: it had no /health endpoint at
    # all (the healthcheck below could never pass — observed FailingStreak:
    # 1274), ran the older single-threaded http.server implementation
    # (serialised every request behind an unbounded qmassa JSON parse, making
    # the dashboard's /metrics poll take 20-40 s), and let qmassa's JSON grow
    # without bound (~596 MB/hour).
    #
    # Those fixes (FastAPI + uvicorn, /health, bounded qmassa collection via
    # collect_gpu.sh) have since been merged back into the edge-ai-suites
    # source, published as hl-ai-metrics-collector:2026.2.0-rc3, so this
    # service can go back to pulling the shared image instead of shadowing it
    # with a locally-built one. Override the tag with METRICS_COLLECTOR_TAG in
    # .env if a newer version is published.
    image: ${REGISTRY:-intel}/hl-ai-metrics-collector:${METRICS_COLLECTOR_TAG:-2026.2.0-rc3}
    container_name: metrics-collector
    privileged: true
    pid: host
    ports:
      - "9000:9000"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
    environment:
      METRICS_DIR:       /tmp/results
      METRICS_HTTP_PORT: "9000"
      NPU_LOG:           /tmp/results/npu_usage.csv
    volumes:
      - ./metrics:/tmp/results
      - /sys/devices:/sys/devices
      - /dev/dri:/dev/dri:rw
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /proc:/proc
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  audio-analyzer:
    image: ${REGISTRY:-intel}/audio-analyzer:${RELEASE_TAG:-latest}
    container_name: audio-analyzer
    # Hardcoded to match the image's baked-in app user and the
    # ownership of the named volumes. Do not change.
    user: "1000:1000"
    ports:
      - "8010:8010"
    devices:
      - /dev/dri:/dev/dri
      # Intel NPU passthrough is driven by ACCEL_MOUNT_PATH so direct Compose
      # runs stay CPU/GPU-safe on hosts without an NPU.
      - ${ACCEL_MOUNT_PATH:-/dev/null}:/dev/accel/accel0
    group_add:
      - video
      - "${RENDER_GID:-992}"
    environment:
      # Required for Level Zero to enumerate the Intel NPU. Harmless when no
      # NPU node is mapped — OpenVINO then reports CPU/GPU only.
      ZE_ENABLE_ALT_DRIVERS: libze_intel_npu.so
      # Whisper mis-detects language on short kiosk chunks and replies in
      # Spanish; forcing en cut WER 11.0% -> 7.0% on every device. The language
      # is a per-request parameter, so it is set by kiosk-core
      # (KIOSK_CORE_ASR_LANGUAGE), not by audio-analyzer config.
      # Point HF cache under the same parent as ~/.cache/whisper so a single
      # ./.cache mount persists every model cache the service uses
      # (huggingface, openai-whisper, torch hub, etc.).
      HF_HOME: /app/audio_analyzer/.cache/huggingface
      # Force fully offline operation for HF model/tokenizer loading. The
      # pyannote diarization pipeline's local files (segmentation, embedding,
      # plda incl. xvec_transform.npz) are already fully cached under
      # ./models by ensure_model.py — but without these flags,
      # huggingface_hub still makes a live metadata/revision check on every
      # load even when local files are present, which crashes/silently
      # disables diarization when there is no network/proxy access at all.
      # Confirmed fix: with HF_HUB_OFFLINE=1 forced, PyannoteDiarizer loads
      # successfully from local cache with zero network calls.
      # Set HF_HUB_OFFLINE=0 / TRANSFORMERS_OFFLINE=0 in .env if this
      # environment has working internet/proxy access and you want live
      # Hub checks (e.g. picking up a newly-released model revision).
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      # HuggingFace token — required by Pyannote speaker diarization.
      # Set HF_TOKEN in .env (single source of truth).
      HF_TOKEN: ${HF_TOKEN:-}
      # Map HF_TOKEN into the config loader's namespace so config.models.asr.hf_token
      # resolves to the token instead of null. The config_loader uses AUDIO_ANALYZER__
      # prefix with __ as path separator (models__asr__hf_token → models.asr.hf_token).
      AUDIO_ANALYZER__MODELS__ASR__HF_TOKEN: ${HF_TOKEN:-}
      # Gate pyannote speaker-diarization + segmentation model preload with the
      # same flag kiosk-core uses to decide whether to request diarization.
      # ./configs/audio-analyzer/config.yaml pins models.asr.diarization: True,
      # which makes preload_models() load pyannote at startup unconditionally —
      # this override lets KIOSK_CORE_DIARIZATION_ENABLED=false (e.g. in CI,
      # where no HF_TOKEN/model-licence acceptance is available) also skip that
      # preload, instead of crashing with an unauthenticated 403 download.
      AUDIO_ANALYZER__MODELS__ASR__DIARIZATION: ${KIOSK_CORE_DIARIZATION_ENABLED:-true}
    volumes:
      # Kiosk-pinned config (see ./configs/README.md) — mounted as the
      # service config without modifying edge-ai-libraries.
      - ./configs/audio-analyzer/config.yaml:/app/audio_analyzer/config.yaml:ro
      # Named volumes so the pull flow works without an edge-ai-libraries
      # clone on disk. Inspect with `docker volume inspect <name>`.
      - audio_analyzer_models:/app/audio_analyzer/models
      - audio_analyzer_chunks:/app/audio_analyzer/chunks
      - audio_analyzer_storage:/app/audio_analyzer/storage
      # Single cache mount — covers HF (HF_HOME above) AND openai-whisper's
      # ~/.cache/whisper, so no model is re-downloaded across restarts.
      - audio_analyzer_cache:/app/audio_analyzer/.cache
    # Whisper warmup on GPU can take ~120s; override the image healthcheck
    # so connection-refused during boot doesn't trip `unhealthy` and abort
    # dependent services (kiosk-core / kiosk-ui).
    healthcheck:
      test: ["CMD", "python3", "-c",
            "import urllib.request; opener = urllib.request.build_opener(urllib.request.ProxyHandler({})); opener.open('http://127.0.0.1:8010/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      start_period: 240s
      retries: 5
    restart: unless-stopped

  text-to-speech:
    image: ${REGISTRY:-intel}/text-to-speech:${RELEASE_TAG:-latest}
    container_name: text-to-speech
    user: "1000:1000"
    ports:
      - "8011:8011"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
      - "${RENDER_GID:-992}"
    environment:
      # Point HF cache under ~/.cache so a single ./.cache mount persists
      # every model cache the service uses (HF, torch hub, etc.).
      HF_HOME: /app/text-to-speech/.cache/huggingface
    volumes:
      # Kiosk-pinned config (see ./configs/README.md) — mounted as the
      # service config without modifying edge-ai-libraries.
      - ./configs/text-to-speech/config.yaml:/app/text-to-speech/config.yaml:ro
      # Named volumes so the pull flow works without an edge-ai-libraries
      # clone on disk. Inspect with `docker volume inspect <name>`.
      - text_to_speech_models:/app/text-to-speech/models
      - text_to_speech_storage:/app/text-to-speech/storage
      # Single cache mount — see audio-analyzer block for rationale.
      - text_to_speech_cache:/app/text-to-speech/.cache
    # Model warmup on GPU can take a while; override the image healthcheck so
    # connection-refused during boot doesn't trip `unhealthy` and abort
    # dependent services (kiosk-core / kiosk-ui) via their
    # `depends_on: service_healthy` gates.
    healthcheck:
      test: ["CMD", "python3", "-c",
            "import urllib.request; opener = urllib.request.build_opener(urllib.request.ProxyHandler({})); opener.open('http://127.0.0.1:8011/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      start_period: 240s
      retries: 5
    restart: unless-stopped

  rag-service:
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    image: ${REGISTRY:-intel}/rag-service:${RELEASE_TAG:-latest}
    container_name: rag-service
    # Hardcoded to match the image's baked-in app user and the
    # ownership of the named volumes. Do not change.
    user: "1000:1000"
    ports:
      - "8020:8020"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
      - "${RENDER_GID:-992}"
    environment:
      MPLCONFIGDIR: /tmp/matplotlib
      # Agent LLM — points at the OVMS container
      AGENT_LLM_URL:   http://ovms-llm:8000/v3
      AGENT_LLM_MODEL: ${OVMS_MODEL_NAME:-OpenVINO/Qwen3-4B-int4-ov}
      AGENT_MCP_CONFIG: /app/rag-service/agentic/resources/mcp_servers.json
      # Release complete sentences to kiosk-core as they are generated rather
      # than after the whole turn, but only for turns the agent's whole-reply
      # guards provably cannot rewrite (see _SentenceGate in ordering_agent.py).
      # Must agree with KIOSK_CORE_AGENT_STREAM_ENABLED on kiosk-core; either
      # flag alone falls back to the buffered /api/v1/agent/chat path.
      # Set AGENT_STREAM_SENTENCES=false to revert with a restart, no rebuild.
      AGENT_STREAM_SENTENCES: ${AGENT_STREAM_SENTENCES:-true}
      # Caps generated tokens per LLM round-trip. Decode dominates agent
      # latency, so this bounds the worst case (a turn that free-runs instead
      # of calling a tool). Tunable from .env without a rebuild.
      AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS:-192}
      # Embedding + reranker models are loaded in-process via OpenVINO at
      # startup. These are intentionally decoupled from TARGET_DEVICE (which
      # only controls the ovms-llm container): both models are exported by
      # optimum-intel with dynamic (unbounded) sequence-length shapes, which
      # the NPU compiler rejects ("Missing upper bound for one or more
      # nodes"). NPU is not a supported value here — use CPU or GPU. CPU is
      # normally fast enough for embedding/reranking; GPU is the default to
      # match prior behavior. Override independently via RAG_EMBEDDING_DEVICE
      # / RAG_RERANKER_DEVICE so environments without a GPU (e.g. CI runners)
      # don't crash on startup with "[GPU] no supported devices found".
      SMART_KIOSK_RAG__MODELS__EMBEDDING__DEVICE: ${RAG_EMBEDDING_DEVICE:-GPU}
      SMART_KIOSK_RAG__RETRIEVAL__RERANKER__DEVICE: ${RAG_RERANKER_DEVICE:-GPU}
      # Retrieval recall knobs. Defaults live in rag-service/config.yaml and
      # are calibrated against the QuickBite KB; override per-deployment when
      # the knowledge base changes materially, since the reranker's logit
      # range is corpus-dependent and must be re-measured.
      SMART_KIOSK_RAG__RETRIEVAL__RERANK_SCORE_THRESHOLD: ${RAG_RERANK_THRESHOLD:--7.0}
      SMART_KIOSK_RAG__RETRIEVAL__FETCH_K: ${RAG_FETCH_K:-10}
      # Context budget handed to the agent's reply call. This is the effective
      # brake on spoken answer length: the model paraphrases whatever it is
      # given, so 2000 chars of context produced a 20-second spoken reply.
      RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-1800}
      # Force fully offline operation for HF tokenizer/model loading — the
      # tokenizer is already cached in the rag_service_hf_cache volume, and
      # newer `transformers` versions otherwise make a live Hub call
      # (list_repo_templates) even when local files exist, which crashes
      # startup when there is no network/proxy access at all.
      # Set HF_HUB_OFFLINE=0 / TRANSFORMERS_OFFLINE=0 in .env if this
      # environment has working internet/proxy access and you want live
      # Hub checks (e.g. picking up a newly-released model revision).
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      # Bypass corporate proxy for all intra-cluster traffic so that
      # requests to ovms-llm, kiosk-core, etc. go directly on the
      # Docker bridge network instead of through the Intel proxy.
      NO_PROXY: "localhost,127.0.0.1,ovms-llm,kiosk-core,audio-analyzer,text-to-speech,metrics-collector,rag-service,172.16.0.0/12,10.0.0.0/8"
      no_proxy: "localhost,127.0.0.1,ovms-llm,kiosk-core,audio-analyzer,text-to-speech,metrics-collector,rag-service,172.16.0.0/12,10.0.0.0/8"
      # Domain-specific config (identity, intent rules, reply templates) is
      # mounted from the consuming application rather than baked into the image.
      # Non-kiosk deployments override this path (or leave it unset for
      # generic RAG-only mode).
      RAG_DOMAIN_CONFIG_PATH: /app/rag-service/domain-config/agent_profile.yaml
      # Enable or disable the ordering-agent subsystem. Set to "false" for
      # pure-RAG deployments (healthcare, education) to skip MCP bootstrap.
      ORDERING_AGENT_ENABLED: ${ORDERING_AGENT_ENABLED:-true}
    volumes:
      - rag_service_models:/app/rag-service/models
      - rag_service_storage:/app/rag-service/storage
      - rag_service_hf_cache:/app/rag-service/.cache/huggingface
      # Mount kiosk-specific domain config into the container.
      # Generic image → kiosk-aware at runtime via this mount.
      - ./configs/rag-service:/app/rag-service/domain-config:ro
      # Mount kiosk domain plugins (ordering agent, guards) from the consuming
      # application. The rag-service image has an empty plugins/ mount point;
      # all domain Python code lives here in the smart-kiosk-assistant repo.
      # When rag-service moves to edge-ai-libraries, only this line changes.
      - ./plugins:/app/rag-service/plugins:ro
    # start_period covers first-run model download + OpenVINO INT8 export
    # (~2-3 min for Qwen3-4B + embeddings + reranker). Cached runs are fast.
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      start_period: 600s
      retries: 10
    restart: unless-stopped

  # OVMS — serves Qwen3-4B-int4-ov for the ordering agent (ADK → LiteLLM → OVMS).
  #
  # Uses OVMS pull mode: if ./models/OpenVINO/Qwen3-4B-int4-ov/ is present
  # (pre-downloaded by setup_models.sh) the model loads from disk; otherwise
  # OVMS pulls it from HuggingFace on first start.
  #
  # Pre-download recommended:
  #   ./setup_models.sh            # GPU (default)
  #   ./setup_models.sh --device CPU
  #
  # Why OpenVINO/Qwen3-4B-int4-ov + hermes3?
  #   Pre-converted INT4 (~2 GB) with native tool-calling support per
  #   https://docs.openvino.ai/2026/model-server/ovms_demos_continuous_batching_agent.html
  #
  # OVMS_TOOL_PARSER must match the model's chat template, not just the vendor:
  #   hermes3 -> Qwen3.x / Qwen2.5      qwen3coder -> Qwen3.5+ (XML tool syntax)
  #   gemma4  -> Gemma 4                phi4       -> Phi-4
  # Setting it to `none` disables parsing; omitting the flag lets OVMS auto-detect
  # from the chat template. A mismatched parser silently drops every tool call.
  #
  # OVMS_TOOL_GUIDED constrains decoding to the tool JSON schema. It is the main
  # mitigation for small models emitting raw tool-result JSON instead of prose.
  #
  # Speculative decoding (--draft_source_model, a Qwen3-0.6B draft model) was
  # benchmarked and REJECTED — see
  # tests/benchmarks/results/replay-qwen3-4b-specdecode.json for the (~4%,
  # noise-level) latency result. Worse: it broke streamed tool-call argument
  # delivery outright. With the draft model attached, OVMS's streaming
  # response emits the tool call's arguments as a single truncated chunk
  # (e.g. ``{"category":``) and immediately closes the stream with
  # ``finish_reason: "tool_calls"``, instead of the correct multi-chunk
  # incremental arguments that non-speculative streaming produces. This
  # surfaced in production as every voice turn that should have called a tool
  # (e.g. "I would like to explore different type of burgers") replying
  # "Sorry, I encountered an error" — a JSONDecodeError parsing the truncated
  # arguments. Confirmed via a raw curl to /v3/chat/completions with
  # stream=true, comparing with and without --draft_source_model. Do not
  # re-add this flag without first confirming OVMS has fixed streamed
  # tool-call + speculative-decoding interaction upstream.
  ovms-llm:
    image: openvino/model_server:latest-gpu
    container_name: ovms-llm
    ports:
      - "9001:9000"  # gRPC (host 9001 avoids conflict with metrics-collector:9000)
      - "8000:8000"  # REST / OpenAI-compatible /v3
    devices:
      - /dev/dri:/dev/dri
      # Intel NPU passthrough — same ACCEL_MOUNT_PATH mechanism as audio-analyzer
      # and queue-service. Defaults to /dev/null (no-op) on hosts without an NPU.
      - ${ACCEL_MOUNT_PATH:-/dev/null}:/dev/accel/accel0
    group_add:
      - video
      - "${RENDER_GID:-992}"
    volumes:
      # Bind-mount pre-downloaded models directory (populated by setup_models.sh).
      # OVMS will pull from HuggingFace on first run if the directory is empty.
      - ./models:/models
      # OpenVINO compilation cache — avoids re-compiling IR on every startup
      - ovms_ov_cache:/tmp/ov_cache
    environment:
      OV_CACHE_DIR: /tmp/ov_cache
      # Required for Level Zero to enumerate the Intel NPU. Harmless when no
      # NPU node is mapped — OpenVINO then reports CPU/GPU only.
      ZE_ENABLE_ALT_DRIVERS: libze_intel_npu.so
    command: >
      --rest_port 8000
      --port 9000
      --source_model ${OVMS_MODEL_NAME:-OpenVINO/Qwen3-4B-int4-ov}
      --model_repository_path /models
      --task text_generation
      --tool_parser ${OVMS_TOOL_PARSER:-hermes3}
      --enable_tool_guided_generation ${OVMS_TOOL_GUIDED:-false}
      --target_device ${TARGET_DEVICE:-GPU}
      --cache_dir /tmp/ov_cache
      --enable_prefix_caching ${OVMS_PREFIX_CACHING:-true}
      --cache_size ${OVMS_KV_CACHE_GB:-4}
      --max_num_seqs ${OVMS_MAX_NUM_SEQS:-4}
      --max_num_batched_tokens ${OVMS_MAX_BATCHED_TOKENS:-4096}
      --plugin_config '{"PERFORMANCE_HINT":"LATENCY"}'
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/v3/models"]
      interval: 20s
      timeout: 10s
      start_period: 300s
      retries: 10
    restart: unless-stopped

  kiosk-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${REGISTRY:-intel}/kiosk-core:${RELEASE_TAG:-latest}
    container_name: kiosk-core
    user: "1000:1000"
    ports:
      - "8012:8012"
    environment:
      KIOSK_CORE_ANALYZER_URL: http://audio-analyzer:8010/v1/audio/transcriptions
      KIOSK_CORE_RAG_URL:      http://rag-service:8020/api/v1/query
      KIOSK_CORE_TTS_URL:      http://text-to-speech:8011/v1/audio/speech
      # Back to Ryan (US English male, bright and projecting) — the
      # text-to-speech service's own default_speaker, and previously
      # confirmed the loudest/fastest built-in voice (see
      # configs/text-to-speech/config.yaml). Kabir was tried and reverted.
      # This override is left explicit (rather than omitted) so the choice
      # is visible here and can be swapped without touching config.yaml.
      # Full supported_speakers list is in configs/text-to-speech/config.yaml.
      KIOSK_CORE_TTS_VOICE:    Ryan
      KIOSK_CORE_METRICS_URL:  http://metrics-collector:9000
      # Diarization — re-enable once HF terms are accepted for pyannote models.
      # Accept terms at: https://huggingface.co/pyannote/speaker-diarization-community-1
      #                  https://huggingface.co/pyannote/speaker-diarization-3.1
      #                  https://huggingface.co/pyannote/segmentation-3.0
      # Was hardcoded to "true" here, which silently ignored any
      # KIOSK_CORE_DIARIZATION_ENABLED=false set in the shell/.env — only
      # audio-analyzer's AUDIO_ANALYZER__MODELS__ASR__DIARIZATION override
      # (below, in the audio-analyzer service) actually read the variable.
      # Parameterized so setting the env var once takes effect on both
      # services (e.g. as a fallback toggle if diarization ever needs to be
      # disabled in an environment where the pyannote model cache is
      # genuinely incomplete). Under normal offline operation, diarization
      # should stay enabled — see the HF_HUB_OFFLINE/TRANSFORMERS_OFFLINE
      # vars on audio-analyzer above, which are the actual fix for pyannote
      # loading fully offline from its already-complete local cache.
      KIOSK_CORE_DIARIZATION_ENABLED: ${KIOSK_CORE_DIARIZATION_ENABLED:-true}
      # Consecutive rejected turns (speaker filter dropped every segment as
      # non-primary) required before the kiosk speaks
      # KIOSK_CORE_UNRECOGNIZED_SPEAKER_PROMPT instead of staying silent.
      # Default upstream is 2 (tolerate a one-off Whisper hallucination/TTS
      # echo). Observed live in this offline deployment: the primary speaker
      # lock flips mid-conversation (diarization/embedding instability), so a
      # single genuine question gets silently dropped with zero feedback
      # before a 2nd consecutive rejection ever happens. Set to 1 here so the
      # customer is never left in silence — see kiosk_core/config.py for the
      # full trade-off.
      KIOSK_CORE_CONSECUTIVE_REJECTION_THRESHOLD: ${KIOSK_CORE_CONSECUTIVE_REJECTION_THRESHOLD:-2}
      # Ordering & agent routing
      KIOSK_CORE_ORDERING_ENABLED: "true"
      KIOSK_CORE_AGENT_URL:        http://rag-service:8020/api/v1/agent/chat
      # Consume the agent's streaming endpoint so TTS synthesis overlaps with
      # generation instead of waiting for the whole turn. Measured on a
      # multi-sentence menu reply: time-to-first-audio 6.8s -> 5.2s, turn total
      # 12.9s -> 11.1s. Single-sentence replies see little change, since most
      # of the latency is tool calls and retrieval rather than token emission.
      # Driven by the same var as AGENT_STREAM_SENTENCES on rag-service; the
      # two must agree, and either alone falls back to the buffered path.
      KIOSK_CORE_AGENT_STREAM_ENABLED: ${AGENT_STREAM_SENTENCES:-true}
      KIOSK_CORE_DB_PATH:          /app/data/kiosk.db
      KIOSK_CORE_PRODUCTS_YAML:    /app/configs/ordering/products.yaml
      KIOSK_CORE_UPSELL_RULES_YAML: /app/configs/ordering/upsell_rules.yaml
      # Identity / biometric auth feature (app-layer flag). Set to "true" AND
      # start with `--profile identity` to bring up the identity-service.
      KIOSK_CORE_IDENTITY_ENABLED: "${KIOSK_CORE_IDENTITY_ENABLED:-false}"
      KIOSK_CORE_IDENTITY_URL:     http://identity-service:8013
      # Queue-service integration (dynamic peak-hour menu)
      KIOSK_CORE_QUEUE_SERVICE_ENABLED: "${KIOSK_CORE_QUEUE_SERVICE_ENABLED:-true}"
      KIOSK_CORE_QUEUE_SERVICE_URL:     http://queue-service:8090
      # Conversation recording (offline analysis). Off by default; set to
      # "true" to append every completed voice turn to
      # ./conversations/<conversation_id>.jsonl on the host (bind-mounted
      # below, so files are inspectable without entering the container).
      KIOSK_CORE_CONVERSATION_LOGGING_ENABLED: "${KIOSK_CORE_CONVERSATION_LOGGING_ENABLED:-false}"
      KIOSK_CORE_CONVERSATION_LOG_DIR:          /app/conversations
      # Bypass corporate proxy for intra-cluster traffic
      NO_PROXY: "localhost,127.0.0.1,ovms-llm,kiosk-core,audio-analyzer,text-to-speech,metrics-collector,rag-service,queue-service,172.16.0.0/12,10.0.0.0/8"
      no_proxy: "localhost,127.0.0.1,ovms-llm,kiosk-core,audio-analyzer,text-to-speech,metrics-collector,rag-service,queue-service,172.16.0.0/12,10.0.0.0/8"
    volumes:
      - generated_audio:/app/generated_audio
      - kiosk_db:/app/data
      - ./configs/ordering:/app/configs/ordering:ro
      - ./conversations:/app/conversations
    depends_on:
      audio-analyzer:
        condition: service_healthy
      text-to-speech:
        condition: service_healthy
      rag-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8012/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # identity-service: multimodal biometric authentication (Face ID + Voiceprint).
  #
  # Gated behind the `identity` compose profile (container-layer flag) — it only
  # starts when you run, e.g.:
  #     KIOSK_CORE_IDENTITY_ENABLED=true docker compose --profile identity up -d
  # The app-layer flag KIOSK_CORE_IDENTITY_ENABLED tells kiosk-core to call it.
  #
  # Shares the same kiosk_db volume as kiosk-core (loyalty_profiles table lives
  # in kiosk.db). FAISS indices live in the separate identity_data volume.
  # ---------------------------------------------------------------------------
  identity-service:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    image: ${REGISTRY:-intel}/identity-service:${RELEASE_TAG:-latest}
    container_name: identity-service
    profiles: ["identity"]
    user: "1000:1000"
    ports:
      - "8013:8013"
    devices:
      - /dev/dri:/dev/dri
      # Intel NPU passthrough — same ACCEL_MOUNT_PATH mechanism as audio-analyzer
      # and queue-service. Defaults to /dev/null (no-op) on hosts without an NPU.
      - ${ACCEL_MOUNT_PATH:-/dev/null}:/dev/accel/accel0
    group_add:
      - video
      - "${RENDER_GID:-992}"
    environment:
      BOOTSTRAP_ON_START:        "${BOOTSTRAP_ON_START:-true}"
      IDENTITY_DB_PATH:          /app/data/kiosk.db
      IDENTITY_FAISS_DIR:        /app/data/identity
      IDENTITY_MODELS_DIR:       /app/models
      IDENTITY_DEVICE:           "${IDENTITY_DEVICE:-GPU}"
      IDENTITY_CONFIG_YAML:      /app/configs/identity/identity_config.yaml
      IDENTITY_PROMPTS_YAML:     /app/configs/identity/verification_prompts.yaml
      # Required for Level Zero to enumerate the Intel NPU. Harmless when no
      # NPU node is mapped — OpenVINO then reports CPU/GPU only.
      ZE_ENABLE_ALT_DRIVERS:     libze_intel_npu.so
      NO_PROXY: "localhost,127.0.0.1,ovms-llm,kiosk-core,audio-analyzer,text-to-speech,metrics-collector,rag-service,identity-service,172.16.0.0/12,10.0.0.0/8"
      no_proxy: "localhost,127.0.0.1,ovms-llm,kiosk-core,audio-analyzer,text-to-speech,metrics-collector,rag-service,identity-service,172.16.0.0/12,10.0.0.0/8"
    volumes:
      # Shared SQLite DB (same file kiosk-core uses).
      - kiosk_db:/app/data
      # FAISS indices live alongside the DB volume but in their own subdir.
      - identity_data:/app/data/identity
      # Pinned config (challenge prompts + bootstrap profiles).
      - ./configs/identity:/app/configs/identity:ro
      # OpenVINO models (face detection/reid, ECAPA-TDNN voice).
      - ./models:/app/models
      # Sample enrolment data for bootstrap profiles.
      - ./identity-service/sample-data:/app/sample-data:ro
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8013/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 5
    restart: unless-stopped

  # Operator/demo screen — chat transcript, performance dashboard, device &
  # knowledge-base settings, QSR tab. Shown on the monitor facing staff/demo
  # audience. KIOSK_UI_MODE is intentionally omitted here: the image defaults
  # to 'operator' (see src/uiMode.ts) so this behaves exactly as before.
  kiosk-ui:
    build:
      context: ./kiosk-ui
      dockerfile: Dockerfile
    image: ${REGISTRY:-intel}/kiosk-ui:${RELEASE_TAG:-latest}
    container_name: kiosk-ui
    ports:
      - "7860:7860"
    environment:
      KIOSK_CORE_UI_BASE_URL:     http://kiosk-core:8012
      KIOSK_CORE_UI_ANALYZER_URL: http://audio-analyzer:8010/v1/audio/transcriptions
      KIOSK_CORE_UI_RAG_URL:      http://rag-service:8020/api/v1/query
      KIOSK_CORE_UI_TTS_URL:      http://text-to-speech:8011/v1/audio/speech
    volumes:
      - generated_audio:/app/generated_audio
    depends_on:
      kiosk-core:
        condition: service_healthy
    restart: unless-stopped

  # Customer-facing screen — single-view menu (queue-driven) + cart + voice
  # "Ask" button, for the physical kiosk touchscreen. Reuses the exact same
  # image/build as kiosk-ui; only KIOSK_UI_MODE and the published port differ,
  # so the two screens can never drift out of sync with each other's backend
  # wiring. No separate build context or Dockerfile.
  kiosk-ui-customer:
    image: ${REGISTRY:-intel}/kiosk-ui:${RELEASE_TAG:-latest}
    container_name: kiosk-ui-customer
    ports:
      - "7861:7860"
    environment:
      KIOSK_UI_MODE:              customer
      KIOSK_CORE_UI_BASE_URL:     http://kiosk-core:8012
      KIOSK_CORE_UI_ANALYZER_URL: http://audio-analyzer:8010/v1/audio/transcriptions
      KIOSK_CORE_UI_RAG_URL:      http://rag-service:8020/api/v1/query
      KIOSK_CORE_UI_TTS_URL:      http://text-to-speech:8011/v1/audio/speech
    volumes:
      - generated_audio:/app/generated_audio
    depends_on:
      kiosk-core:
        condition: service_healthy
      kiosk-ui:
        condition: service_started
    restart: unless-stopped

volumes:
  generated_audio:
  audio_analyzer_models:
  audio_analyzer_chunks:
  audio_analyzer_storage:
  audio_analyzer_cache:
  text_to_speech_models:
  text_to_speech_storage:
  text_to_speech_cache:
  rag_service_models:
  rag_service_storage:
  rag_service_hf_cache:
  kiosk_db:
  # FAISS biometric indices for identity-service (face_index.bin / voice_index.bin)
  identity_data:
  # OpenVINO compilation cache for ovms-llm — avoids re-compiling model IR on restart
  ovms_ov_cache:
