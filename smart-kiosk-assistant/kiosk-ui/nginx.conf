# nginx reverse proxy for the kiosk React SPA.
# Serves the static bundle and proxies backend calls so the browser uses a
# single origin (mirrors the Vite dev proxy in vite.config.ts).

server {
    listen 7860;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large audio chunk uploads (WAV POSTs to kiosk-core).
    client_max_body_size 25m;

    # Re-resolve upstream hostnames on every request (Docker's embedded DNS,
    # short TTL) instead of nginx's default of resolving each proxy_pass
    # hostname once at worker-process startup and caching it forever. Without
    # this, any backend container that gets recreated with a new IP (e.g.
    # kiosk-core recreated by `docker compose up` when its env changes, such
    # as toggling identity mode) leaves nginx sending traffic to the old,
    # dead IP until this container itself restarts — surfacing as a 502 that
    # "only" happens when identity is enabled on an already-running stack.
    resolver 127.0.0.11 valid=10s;

    # ── kiosk-core hands-free WebSocket (binary PCM uplink) ───────────────────
    # Must precede the generic /api/ location and carry the Upgrade headers so
    # the persistent full-duplex socket survives the nginx hop. Used only by the
    # hands-free browser path; push-to-talk and the benchmark use plain /api/.
    location = /api/v1/sessions/stream {
        set $upstream_kiosk_core_ws kiosk-core:8012;
        proxy_pass http://$upstream_kiosk_core_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── kiosk-core (path preserved: backend already serves /api/...) ──────────
    location /api/ {
        set $upstream_kiosk_core kiosk-core:8012;
        proxy_pass http://$upstream_kiosk_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # ── rag-service (strip /rag prefix) ───────────────────────────────────────
    location /rag/ {
        set $upstream_rag rag-service:8020;
        rewrite ^/rag/(.*)$ /$1 break;
        proxy_pass http://$upstream_rag;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # ── text-to-speech (strip /tts prefix) ────────────────────────────────────
    location /tts/ {
        set $upstream_tts text-to-speech:8011;
        rewrite ^/tts/(.*)$ /$1 break;
        proxy_pass http://$upstream_tts;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # ── audio-analyzer / ASR (strip /asr prefix) ──────────────────────────────
    location /asr/ {
        set $upstream_asr audio-analyzer:8010;
        rewrite ^/asr/(.*)$ /$1 break;
        proxy_pass http://$upstream_asr;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # ── metrics-collector (strip /metrics-svc prefix) ─────────────────────────
    location /metrics-svc/ {
        set $upstream_metrics metrics-collector:9000;
        rewrite ^/metrics-svc/(.*)$ /$1 break;
        proxy_pass http://$upstream_metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # ── queue-service: count API + MJPEG stream (strip /queue-svc prefix) ────
    # The MJPEG stream is a long-lived chunked response; disable proxy buffering
    # so frames are forwarded to the browser immediately.
    location /queue-svc/ {
        set $upstream_queue queue-service:8090;
        rewrite ^/queue-svc/(.*)$ /$1 break;
        proxy_pass http://$upstream_queue;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
