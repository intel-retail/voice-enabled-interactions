app:
  name: Audio Analyzer
  cleanup_on_exit: true
  clear_storage_on_startup: true  # delete all session folders under storage/ at startup
  use_ov_genai: True # True or False, applicable for provider: openvino

models:
  asr:
    provider: openai # openai | openvino | whispercpp
    name: whisper-base  # whisper-tiny | whisper-base | whisper-small | whisper-medium | whisper-large
    device: CPU # CPU recommended; CPU only for whispercpp, CPU or GPU for openvino provider
    weight_format: null # OpenVINO: int8 | fp16 | null. whispercpp: null | q5 | q5_0 | q5_1 | q8 | q8_0 | int5 | int8
    temperature: 0.0
    diarization: True        # set True to enable pyannote speaker diarization
                              # REQUIRES: accept model license at HF before enabling:
                              #   https://huggingface.co/pyannote/speaker-diarization-3.1
                              #   https://huggingface.co/pyannote/segmentation-3.0
                              # (403 on file download = terms not yet accepted)
    hf_token: null                # Set HF_TOKEN in .env — passed via docker-compose environment.
                              # The audio-analyzer service reads HF_TOKEN env var automatically
                              # when hf_token is null. See docker-compose.yml audio-analyzer.environment.
    models_base_path: "models"

    # Hallucination filtering — openai provider uses native no_speech_prob/avg_logprob.
    # whispercpp derives the same values from per-token plog and ptsum.
    # openvino genai pipelines do not expose these fields; filtering is skipped.
    #
    # Values below are tuned for live microphone input (noisy environment).
    # Lower no_speech_threshold → stricter: flags more segments as potential noise.
    # Higher logprob_threshold  → stricter: drops low-confidence transcriptions.
    # Higher min_duration_sec / min_words → harder for noise bursts to earn the
    #   "definitely speech, keep" safety net in _is_silent_segment().
    no_speech_threshold: 0.3
    logprob_threshold: -0.3
    min_duration_sec: 0.5
    min_words: 2

    # openai-whisper transcribe() native param: skip generation over silent
    # regions longer than this many seconds.  Directly targets the
    # noise-transcribed-as-text problem.  null = disabled.
    hallucination_silence_threshold: 1.0

    # Post-processing repetition filter (all providers).
    # 1.0 = disabled. Any value > 1.0 enables consecutive repeated-phrase
    # removal (word n-gram dedup, window 1-8) and duplicate-segment stripping.
    # Note: openai-whisper's DecodingOptions has no repetition_penalty field;
    # this is applied after transcription, not inside the decoder.
    repetition_penalty: 1.8

    # Decoder controls — beam_size/best_of apply to openai and whispercpp.
    # threads is whisper.cpp specific.
    beam_size: 1
    best_of: 1
    # Word-level timings. Required by diarization: when Whisper merges two
    # speakers into one segment, per-word times are the only way to split that
    # segment at the acoustic speaker-change boundary without guessing.
    # Supported by the openai and whispercpp providers.
    word_timestamps: true
    threads: 0

  diarization: # Only applicable when models.asr.diarization is set to True
    provider: "huggingface"
    name: "pyannote/speaker-diarization-3.1"
    device: CPU  # CPU or GPU
    models_base_path: "models"

    # ── Clustering aggressiveness (single-mic kiosk tuning) ────────────────
    # Force the pipeline to always split into at least 2 speaker clusters so
    # a secondary voice on the same mic gets a distinct label (SPEAKER_01)
    # even when its embedding is close to the primary speaker's. Combined
    # with a lower clustering threshold this reliably surfaces the second
    # speaker whom kiosk-core then hard-drops via first-speaker lock-on.
    min_speakers: 1                # allow single-speaker chunks; split only when evidence supports it
    max_speakers: 4                # cap runaway clustering (customer + up to 3 bystanders)
    clustering_threshold: 0.5      # default 0.7154; lower → more speakers detected
    segmentation_threshold: 0.4    # default 0.4442; lower → more speech turns split

    # ── Voice enrollment fallback (Option 3) ──────────────────────────────
    # When pyannote's clustering fails to separate two co-located voices we
    # fall back to per-session voice enrollment: the first sufficiently-long
    # speech turn is treated as the "primary" speaker, and every subsequent
    # turn is relabelled by cosine similarity to that reference embedding.
    voice_enrollment_enabled: true
    # Measured same-speaker cosine spread with a 1.5s reference was 0.21-0.68
    # (median ~0.46) — i.e. the old 0.5 threshold rejected more than half of the
    # customer's own speech. Widening the enrollment/comparison windows below
    # tightens that spread; keep this slightly under the old value while the
    # longer windows bed in. Re-measure from the [DIARIZATION][MATCH] log lines
    # before tightening it again.
    voice_match_threshold: 0.45    # cosine sim ≥ this → SPEAKER_00 (primary)
    min_enrollment_duration: 2.0   # seconds; ignore very short turns for enrollment
    # Enrollment is keyed on the conversation id sent by kiosk-core
    # (speaker_scope_id), so it survives across utterances. Evict idle
    # conversations so the cache cannot grow without bound.
    enrollment_ttl_seconds: 1800
    # Minimum audio span used to classify a speaker. Embeddings computed on
    # much less than this are unstable, so words are grouped into windows of
    # at least this length before being compared to the enrolled voice.
    # At 0.8s the per-window scores for a single speaker swung by ±0.2 cosine,
    # which is wider than the gap between the customer and a bystander.
    min_window_seconds: 1.5
    # Span taken from the start of the first qualifying segment when enrolling
    # the primary voice. This span always belongs to the customer (it is the
    # opening of the first utterance), so a longer window buys a much more
    # stable reference embedding without any real contamination risk.
    enrollment_window_seconds: 4.0

audio_preprocessing:
  chunk_duration_sec: 15
  silence_threshold: -35  # in dB
  silence_duration: 0.3   # minimum silence length in seconds
  search_window_sec: 1    # how far to look for silence if no silence exactly at chunk boundary
  chunk_output_path: chunks/
  denoise: false          # set true for noisy mic/field audio (applies ffmpeg arnndn RNNoise filter)
  denoise_model: ""       # path to .rnnn model file; leave empty to use ffmpeg built-in arnndn

audio_util:
  max_size_mb: 200
  allowed_extensions:
    - .wav
    - .mp3
    - .m4a
  chunk_size: 52428800   # 1024 * 1024 * 50 = 50MB

pipeline:
  delete_chunks_after_use: true

sentiment:
  enabled: false                  # set true to enable parallel voice sentiment analysis
  model: speechbrain/emotion-recognition-wav2vec2-IEMOCAP
  device: CPU                     # CPU | GPU (openvino export only)
  provider: openvino              # openvino | pytorch
  weight_format: int8             # Optional OpenVINO export precision, e.g. int8 | fp16
  models_base_path: "models"
  # Aggregation — how to compute session-level sentiment from per-chunk results
  # recency_weight: higher weight on recent chunks (good for kiosk drift detection)
  recency_weight: 0.7             # 0.0 = equal weight, 1.0 = last chunk only
  peak_label: angry               # label to watch for peak/escalation detection
